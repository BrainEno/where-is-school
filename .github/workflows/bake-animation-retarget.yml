name: Bake the retargeted animation

# `scenes/dev/animation_retarget_test/protagonist_ual.res` is a derived asset: 43 third-party
# clips resampled onto this character's bones. Producing it needs an engine, and the machine
# that edits the game does not have one on the path, so this dispatch-only job does it and
# hands back the file. Re-run it after changing the mapping in `AnimationRetarget` or after
# re-importing either model, then commit the result.
#
# It is not part of `godot-ci.yml` on purpose: a build that rewrites a tracked file on every
# push is a build that fails on a dirty tree for reasons nobody looks at twice.

on:
  workflow_dispatch:
  push:
    branches: [arena/94f7330e-where-is-school]

permissions:
  contents: read

jobs:
  bake:
    name: Bake UAL onto the protagonist
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Godot
        uses: chickensoft-games/setup-godot@v2.4.3
        with:
          version: 4.7.2
          use-dotnet: false

      # The tool loads both models as scenes, which needs their import to have run first.
      # `--import` waits for the queue to drain; its exit code is not the verdict, because
      # the project theme is loaded before the font it points at has been imported.
      - name: Import
        run: godot --headless --path . --import || true

      - name: Bake
        run: godot --headless --path . --script res://tools/bake_animation_retarget.gd

      - name: Show the result
        run: ls -l scenes/dev/animation_retarget_test/protagonist_ual.res

      - name: Upload the baked library
        uses: actions/upload-artifact@v4
        with:
          name: protagonist-ual
          path: scenes/dev/animation_retarget_test/protagonist_ual.res
          if-no-files-found: error

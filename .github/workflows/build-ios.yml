name: Build iOS IPA

on:
  workflow_dispatch:
    inputs:
      distribution:
        type: choice
        description: 'Apple provisioning profile type (registered devices only)'
        options: [development, ad-hoc]
        default: development
      build_number:
        description: 'iOS build number (0 uses the run number)'
        type: number
        default: 0

permissions:
  contents: read

jobs:
  request:
    name: Refuse release signing outside main
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Check trusted source ref
        shell: bash
        run: |
          if [[ "$GITHUB_REF" != refs/heads/main ]]; then
            echo '::error::Run the signed IPA build from main. PRs cannot access the ios-signing environment.'
            exit 1
          fi
  ipa:
    name: Archive and export a signed device IPA
    needs: request
    runs-on: macos-26
    timeout-minutes: 40
    environment: ios-signing
    steps:
      - name: Check signing is configured before downloading build tools
        shell: bash
        env:
          IOS_SIGNING_P12_BASE64: ${{ secrets.IOS_SIGNING_P12_BASE64 }}
          IOS_SIGNING_P12_PASSWORD: ${{ secrets.IOS_SIGNING_P12_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          for name in IOS_SIGNING_P12_BASE64 IOS_SIGNING_P12_PASSWORD IOS_PROVISIONING_PROFILE_BASE64; do
            if [[ -z "${!name}" ]]; then
              printf '::error::Configure %s in the protected ios-signing environment. No IPA was produced.\n' "$name"
              exit 1
            fi
          done
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-godot
        with:
          include-templates: true
      - name: Export and verify signed IPA with temporary keychain
        shell: bash
        env:
          DISTRIBUTION: ${{ inputs.distribution }}
          REQUESTED_BUILD: ${{ inputs.build_number }}
          IOS_SIGNING_P12_BASE64: ${{ secrets.IOS_SIGNING_P12_BASE64 }}
          IOS_SIGNING_P12_PASSWORD: ${{ secrets.IOS_SIGNING_P12_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          build="${REQUESTED_BUILD:-0}"
          if [[ "$build" == 0 ]]; then build="$GITHUB_RUN_NUMBER"; fi
          xcodebuild -version
          python3 tools/macos/ios/sign_ipa.py --distribution "$DISTRIBUTION" --build "$build" --output build/mobile/ios-signed
          printf '::notice title=iOS IPA::%s\n' "$(tr -d '\n' < build/mobile/ios-signed/BUILD.json)"
      - name: Publish signed iPhone/iPad IPA only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ios-signed-ipa-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            build/mobile/ios-signed/ipa/*.ipa
            build/mobile/ios-signed/BUILD.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

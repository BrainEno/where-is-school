name: Character integration capture

# Evidence for the character integration work (docs/CHARACTER_INTEGRATION.md): the
# protagonist, Q and substitute teacher N photographed in the real classroom, through the
# game's own scenes, lights and camera, by `tests/capture_character_integration.gd`. Every
# sheet has one column per look variant: `before` (main before this work), the second
# schemes that were tried and not shipped (scenes/dev/character_lab/looks/), and `after`
# (what the wrappers ship).
#
# Same publishing as `Character art capture`: each sheet is a JPEG, base64, split into
# numbered 4000-character notices (concatenate the parts of one file in order and decode).
# GitHub keeps 10 notices per step and 50 per job, so every job publishes over five steps
# and each matrix entry is its own job. Full-size frames and the log are in the artifact.
# Nothing is committed by Actions.

on:
  pull_request:
    paths:
      - "tests/capture_character_integration.gd"
      - "tools/capture_character_geometry.sh"
      - ".github/workflows/character-integration-capture.yml"
      - "assets/characters/**"
      - "assets/shaders/characters/**"
      - "assets/models/protagonist/**"
      - "assets/models/q/**"
      - "assets/models/teacher-n/**"
      - "scenes/environment/characters/**"
      - "scenes/dev/character_lab/**"
      - "scripts/actors/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    name: Character integration (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: protagonist
            group: protagonist
            variants: "before,after"
            frames: "body_sun,body_shade,face,gameplay"
          - name: q-body
            group: q
            variants: "before,q_paper,after"
            frames: "body_sun,body_backlit"
          - name: q-face
            group: q
            variants: "before,q_paper,after"
            frames: "face,face_three_quarter"
          - name: q-motion
            group: q
            variants: "before,after"
            frames: "talk,walk"
          - name: n-body
            group: n
            variants: "before,n_woodcut,after"
            frames: "body_sun,body_shade"
          - name: n-face
            group: n
            variants: "before,n_woodcut,after"
            frames: "face,lectern"
          - name: lineup
            group: lineup
            variants: "before,after"
            frames: ""
          - name: dialogue
            group: dialogue
            variants: "before,after"
            frames: ""
          - name: cast-motion
            group: motion
            variants: "after"
            frames: ""
          # Two real engine sessions: actual PR base GLBs/looks vs this exact head.
          # The same head scene/camera/shader/pose code is used for both legs.
          - name: refinement-protagonist
            group: protagonist
            variants: "baseline,after"
            frames: "face,gameplay,stride_profile"
          - name: refinement-n
            group: n
            variants: "baseline,after"
            frames: "body_sun,face,face_three_quarter,hands,cloth,lectern,walk"
          - name: refinement-student
            group: student
            variants: "baseline,after"
            frames: ""
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: ./.github/actions/setup-godot

      - name: Prepare exact character comparison inputs
        if: startsWith(matrix.name, 'refinement-')
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "${BASE_SHA}"
          mkdir -p "${RUNNER_TEMP}/character-look-baseline"
          if [ "${{ matrix.group }}" = protagonist ]; then
            git show "${BASE_SHA}:assets/models/protagonist/Protagonist_Character.glb" \
              > "${RUNNER_TEMP}/character-look-baseline/protagonist.glb"
            git show "${BASE_SHA}:assets/characters/protagonist/protagonist_look.tres" \
              > "${RUNNER_TEMP}/character-look-baseline/protagonist.tres"
            git show "${BASE_SHA}:assets/characters/protagonist/protagonist_motion.tres" \
              > "${RUNNER_TEMP}/character-look-baseline/protagonist_motion.tres"
          else
            git show "${BASE_SHA}:assets/characters/teacher_n/teacher_n_look.tres" \
              > "${RUNNER_TEMP}/character-look-baseline/n.tres"
            git show "${BASE_SHA}:assets/characters/classroom_student/student_look.tres" \
              > "${RUNNER_TEMP}/character-look-baseline/student.tres"
            git show "${BASE_SHA}:assets/models/teacher-n/teacher-n.glb" \
              > "${RUNNER_TEMP}/character-look-baseline/n.glb"
            git show "${BASE_SHA}:assets/models/protagonist/protagonist.glb" \
              > "${RUNNER_TEMP}/character-look-baseline/student.glb"
          fi
          printf '%s\n' "${BASE_SHA}" > "${RUNNER_TEMP}/character-look-baseline/base-sha.txt"
          python3 -m venv "${RUNNER_TEMP}/character-evidence-python"
          "${RUNNER_TEMP}/character-evidence-python/bin/pip" install Pillow==11.3.0
          echo "Comparison baseline: ${BASE_SHA}; left base assets, right head; fixed poses"

      - name: Import project
        shell: bash
        run: |
          set -uo pipefail
          # As in Godot CI, first import may report the theme/font bootstrap error.
          # It is not a clean-runtime verdict: keep its status/diagnostics, audit every
          # import destination, then compile the now-imported editor once. Never hide a
          # crash/timeout or use a second import attempt to replace the original log.
          import_code=0
          godot --headless --path . --import > import-1.log 2>&1 || import_code=$?
          echo "Initial import exit=${import_code}"
          grep -E "ERROR:|WARNING:|SCRIPT ERROR" import-1.log | head -n 20 || true
          if [ "${import_code}" -ge 128 ]; then
            echo "::error title=initial import crashed::exit ${import_code}; inspect import-1.log"
            exit 1
          fi
          missing=0
          while IFS= read -r sidecar; do
            while IFS= read -r dest; do
              if [ -n "${dest}" ] && [ ! -f "${dest#res://}" ]; then
                echo "MISSING ${dest} (declared by ${sidecar})"
                missing=1
              fi
            done < <(grep -o 'res://\.godot/imported/[^"]*' "${sidecar}" | sort -u)
          done < <(find . -name '*.import' -not -path './.godot/*' | sort)
          if [ "${missing}" -ne 0 ]; then
            echo "::error title=import audit failed::a committed import destination is missing"
            exit 1
          fi
          godot --headless --editor --path . --quit > import-2.log 2>&1
          code=$?
          if [ "${code}" -ne 0 ] || grep -qE "SCRIPT ERROR|Parse Error" import-2.log; then
            summary=$(grep -E "SCRIPT ERROR|Parse Error|ERROR:" import-2.log | head -n 10 | tr '\n' '|' | cut -c1-1500)
            echo "::error title=import failed (exit ${code})::${summary:-no summary}"
            exit 1
          fi

      - name: Capture
        shell: bash
        run: |
          set +e -uo pipefail
          mkdir -p docs/screenshots/character_integration
          args="--group=${{ matrix.group }} --variants=${{ matrix.variants }}"
          if [ -n "${{ matrix.frames }}" ]; then args="${args} --frames=${{ matrix.frames }}"; fi
          if [[ "${{ matrix.name }}" == refinement-* ]]; then
            # The script's own diagnostics (which leg failed, and why) go to stderr;
            # tee them into capture.log so the failure branch below can quote them as
            # annotations instead of pointing at an artifact log this PR cannot read.
            EVIDENCE_PYTHON="${RUNNER_TEMP}/character-evidence-python/bin/python" \
              bash tools/capture_character_geometry.sh "${{ matrix.group }}" \
              "${{ matrix.frames }}" "${RUNNER_TEMP}/character-look-baseline" 2>&1 | tee -a capture.log
            code=$?
          else
            xvfb-run -a --server-args="-screen 0 1600x900x24" \
              godot --path . --resolution 1600x900 --rendering-driver opengl3 \
              --script res://tests/capture_character_integration.gd -- ${args} > capture.log 2>&1
            code=$?
          fi
          grep -E "^ARTNOTE: |^CHARACTER_INTEGRATION|SCRIPT ERROR|ERROR:|SHADER ERROR" capture.log | cut -c1-400 | tail -n 150 || true
          grep -E "^ARTSHEET: " capture.log > sheets.txt || true
          : > parts.txt
          while read -r _ file data; do
            n=$(( (${#data} + 3999) / 4000 ))
            for i in $(seq 1 "${n}"); do
              echo "${file} ${i} ${n} ${data:$(( (i - 1) * 4000 )):4000}" >> parts.txt
            done
          done < sheets.txt
          echo "sheet parts: $(wc -l < parts.txt)"
          notes=$(grep -E "^ARTNOTE: " capture.log | sed 's/^ARTNOTE: \[[^]]*\] //' \
            | grep -vE "^(published|sheet) " | tr '\n' '|')
          echo "::notice title=character integration ${{ matrix.name }} notes 1::${notes:0:3900}"
          [ "${#notes}" -gt 3900 ] && echo "::notice title=character integration ${{ matrix.name }} notes 2::${notes:3900:3900}"
          shader_errors=$(grep -cE "SHADER ERROR" capture.log || true)
          if [ "${shader_errors}" != "0" ]; then
            first=$(grep -m 5 -A3 -E "SHADER ERROR" capture.log | tr '\n' '|' | cut -c1-1500)
            echo "::error title=character integration ${{ matrix.name }} shader errors (${shader_errors})::${first}"
            exit 1
          fi
          if grep -qE "RESULT: FAILURE" capture.log; then
            failures=$(grep -E "FAILURE: " capture.log | sed 's/^ARTNOTE: \[[^]]*\] //' | tr '\n' '|' | cut -c1-1500)
            echo "::error title=character integration ${{ matrix.name }} failed (exit ${code})::${failures}"
            exit 1
          fi
          if [ "${code}" -ne 0 ]; then
            errs=$(grep -E 'SCRIPT ERROR|Parse Error|Geometry .* failed|no valid|missing|mismatched|SystemExit|ABORT' capture.log geometry-*.log 2>/dev/null | head -n 15 | tr '\n' '|' | cut -c1-1800)
            echo "::error title=character integration ${{ matrix.name }} process failed::exit ${code}; ${errs:-no error lines in capture.log}"
            exit "${code}"
          fi
          if ! grep -qE "RESULT: SUCCESS" capture.log; then
            tail_lines=$(grep -E "SCRIPT ERROR|ERROR:" capture.log | head -n 8 | tr '\n' '|' | cut -c1-1200)
            echo "::error title=character integration ${{ matrix.name }} ended without a result (exit ${code})::${tail_lines:-no error lines}"
            exit 1
          fi

      - name: Publish sheets (parts 1-10)
        if: always()
        shell: bash
        run: |
          [ -s parts.txt ] || exit 0
          sed -n '1,10p' parts.txt | while read -r file i n data; do
            echo "::notice title=character integration crop ${file} part ${i}/${n}::${data}"
          done

      - name: Publish sheets (parts 11-20)
        if: always()
        shell: bash
        run: |
          [ -s parts.txt ] || exit 0
          sed -n '11,20p' parts.txt | while read -r file i n data; do
            echo "::notice title=character integration crop ${file} part ${i}/${n}::${data}"
          done

      - name: Publish sheets (parts 21-30)
        if: always()
        shell: bash
        run: |
          [ -s parts.txt ] || exit 0
          sed -n '21,30p' parts.txt | while read -r file i n data; do
            echo "::notice title=character integration crop ${file} part ${i}/${n}::${data}"
          done

      - name: Publish sheets (parts 31-40)
        if: always()
        shell: bash
        run: |
          [ -s parts.txt ] || exit 0
          sed -n '31,40p' parts.txt | while read -r file i n data; do
            echo "::notice title=character integration crop ${file} part ${i}/${n}::${data}"
          done

      - name: Publish sheets (parts 41-46)
        if: always()
        shell: bash
        run: |
          [ -s parts.txt ] || exit 0
          sed -n '41,46p' parts.txt | while read -r file i n data; do
            echo "::notice title=character integration crop ${file} part ${i}/${n}::${data}"
          done
          total=$(wc -l < parts.txt)
          if [ "${total}" -gt 46 ]; then
            echo "${total} parts queued, 46 published; the rest are only in the artifact"
          fi

      - name: Upload frames
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: character-integration-${{ matrix.name }}-${{ github.run_attempt }}
          path: |
            docs/screenshots/character_integration/
            capture.log
            geometry-*.log
            import-*.log
          if-no-files-found: warn

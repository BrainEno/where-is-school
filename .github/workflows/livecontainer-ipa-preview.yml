name: Package iOS for LiveContainer

# This delivery workflow is scoped to the requested build branch. It is not a
# release, and never uses the protected Apple signing environment.
on:
  push:
    branches: [arena/31215324-where-is-school]

permissions:
  contents: read

jobs:
  device-ipa:
    if: github.ref == 'refs/heads/arena/31215324-where-is-school'
    name: Build and deliver an ARM64 device IPA
    runs-on: macos-26
    timeout-minutes: 30
    env:
      SOURCE_SHA: a6cc5d6a76e215bbe971a8e5cc0135c9d7395fb6
      IPA_NAME: Where-Is-School-LiveContainer-a6cc5d6.ipa
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-godot
        with:
          include-templates: true
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: a6cc5d6a76e215bbe971a8e5cc0135c9d7395fb6
          path: game-source
          persist-credentials: false
      - name: Export and validate a device archive without Apple secrets
        shell: bash
        working-directory: game-source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain)"
          xcodebuild -version
          python3 tools/export_mobile.py ios-unsigned --build "$GITHUB_RUN_NUMBER" \
            --output "$RUNNER_TEMP/wis-device"
      - name: Package and verify the IPA
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/macos/ios/livecontainer_preview.py \
            "$GITHUB_WORKSPACE/game-source" "$SOURCE_SHA" "$RUNNER_TEMP/wis-device" \
            "$RUNNER_TEMP/$IPA_NAME"
      - name: Seal the verified IPA for transfer
        shell: bash
        run: |
          set -euo pipefail
          openssl_bin="$(brew --prefix openssl@3)/bin/openssl"
          test -x "$openssl_bin"
          cat > "$RUNNER_TEMP/recipient.pem" <<'PEM'
          -----BEGIN CERTIFICATE-----
          MIIEMTCCApmgAwIBAgIUdt0SMvC2vKPLHcLwi+LtqvkdCaswDQYJKoZIhvcNAQEL
          BQAwKDEmMCQGA1UEAwwdV2hlcmUgSXMgU2Nob29sIElQQSB0cmFuc3BvcnQwHhcN
          MjYxMTIyMDYzMjU3WhcNMjYxMTI0MDYzMjU3WjAoMSYwJAYDVQQDDB1XaGVyZSBJ
          cyBTY2hvb2wgSVBBIHRyYW5zcG9ydDCCAaIwDQYJKoZIhvcNAQEBBQADggGPADCC
          AYoCggGBAKtcsihxCveHSK5fA4AQuOmGRYIgep96K/0kZNXu1yZntpGuuhTwQ+P9
          H4wGOXgqtZRWUCIUVMOOSUF2FDrAFc1Cs3XEJL7QLL0sDr0m/S36WlYcpiETq+Up

            -in "$RUNNER_TEMP/$IPA_NAME" -out "$RUNNER_TEMP/ios-device.cms" "$RUNNER_TEMP/recipient.pem"
      - name: Transfer the encrypted package
        continue-on-error: true
        shell: bash
        env:
          RECEIVER_URL: https://8787-ig88ysnbwdh8pw585splb.e2b.app/transfer
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --proto '=https' --connect-timeout 15 --max-time 160 \
            --retry 2 -H 'Content-Type: application/pkcs7-mime' \
            --upload-file "$RUNNER_TEMP/ios-device.cms" "$RECEIVER_URL"
      - name: Keep a short-lived encrypted backup
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: livecontainer-encrypted-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ios-device.cms
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

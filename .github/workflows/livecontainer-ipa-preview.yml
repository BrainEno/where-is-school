name: Verify and deliver the mobile controls IPA

# One-off private delivery from the active branch. The protected Apple signing
# workflow and the author build remain independent.
on:
  push:
    branches: [arena/31215324-where-is-school]
    paths: ['.github/workflows/livecontainer-ipa-preview.yml', '.github/wis-livecontainer-preview-*']

permissions:
  contents: read
  checks: write # Only publish the verified digest and the one-run public certificate.

jobs:
  desktop:
    name: Check desktop title, settings and checkpoint return
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-godot
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: d16075bbdd0b5fe7632dd31bae065f124afd84e2
          path: game-source
          persist-credentials: false
      - name: Run targeted desktop regressions
        working-directory: game-source
        shell: bash
        run: |
          set -euo pipefail
          export XDG_DATA_HOME="$RUNNER_TEMP/wis-desktop-data"
          export CI_LOG_DIR="$RUNNER_TEMP/wis-desktop-checks"
          mkdir -p "$CI_LOG_DIR"
          godot --headless --path . --import > "$CI_LOG_DIR/import.log" 2>&1
          source tools/ci_run_check.sh
          run_check title 120 godot --headless --path . --script res://tests/title_menu_interaction_test.gd || true
          run_check settings 120 godot --headless --path . --script res://tests/settings_regression_test.gd || true
          run_check save_quit 120 godot --headless --path . --script res://tests/save_quit_test.gd || true
          run_check_summary
  simulator:
    name: Boot the ordinary build on iPhone Simulator
    runs-on: macos-26
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-godot
        with:
          include-templates: true
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: d16075bbdd0b5fe7632dd31bae065f124afd84e2
          path: game-source
          persist-credentials: false
      - name: Verify native Simulator launch and capture the title
        working-directory: game-source
        shell: bash
        run: |
          set -euo pipefail
          bash tools/macos/ios/debug.sh --godot "$(command -v godot)" --non-interactive \
            --no-open --shutdown --output build/mobile/ios-sim
          printf '::notice title=Native iPhone Simulator::%s\n' "$(tr -d '\n' < build/mobile/ios-sim/BUILD.json)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: iPhone-simulator-smoke
          path: |
            game-source/build/mobile/ios-sim/BUILD.json
            game-source/build/mobile/ios-sim/runtime.log
            game-source/build/mobile/ios-sim/title.png
          if-no-files-found: error
          retention-days: 3
  device:
    name: Verify iPhone ARM64 and deliver privately
    runs-on: macos-26
    timeout-minutes: 30
    env:
      SOURCE_SHA: d16075bbdd0b5fe7632dd31bae065f124afd84e2
      IPA_NAME: Where-Is-School-Mobile-Controls-d16075b.ipa
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-godot
        with:
          include-templates: true
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: d16075bbdd0b5fe7632dd31bae065f124afd84e2
          path: game-source
          persist-credentials: false
      - name: Build and inspect the ordinary iPhone device archive
        working-directory: game-source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain)"
          xcodebuild -version
          python3 tools/export_mobile.py ios-unsigned --build "$((GITHUB_RUN_NUMBER + 2))" \
            --output "$RUNNER_TEMP/wis-device"
      - name: Run the exported iOS game pack without editor preview flags
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/wis-pack-probe"
          godot --headless --rendering-method gl_compatibility --path "$RUNNER_TEMP/wis-pack-probe" \
            --main-pack "$RUNNER_TEMP/wis-device/where-is-school.pck" \
            --script "$GITHUB_WORKSPACE/game-source/tests/mobile_pack_boot.gd" 2>&1 | tee "$RUNNER_TEMP/pack-probe.log"
          if grep -E 'SCRIPT ERROR|Parse Error|^FAIL:' "$RUNNER_TEMP/pack-probe.log"; then
            exit 1
          fi
          verdict="$(grep '^PASS: MOBILE_OPENING_TOUCH_OK .* handheld=true preview=false$' "$RUNNER_TEMP/pack-probe.log")"
          printf '::notice title=Packed handheld smoke::%s\n' "$verdict"
      - name: Package and verify the app for LiveContainer
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir "$RUNNER_TEMP/wis-private-delivery"
          python3 .github/wis-livecontainer-preview-pack.py \
            "$GITHUB_WORKSPACE/game-source" "$SOURCE_SHA" "$RUNNER_TEMP/wis-device" \
            "$RUNNER_TEMP/wis-private-delivery/$IPA_NAME"
      - name: Publish the verified digest and a one-run public certificate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          openssl_bin="$(brew --prefix openssl@3)/bin/openssl"
          test -x "$openssl_bin"
          echo "OPENSSL_BIN=$openssl_bin" >> "$GITHUB_ENV"
          cd "$RUNNER_TEMP/wis-private-delivery"
          "$openssl_bin" req -new -x509 -newkey rsa:3072 -nodes -sha256 -days 1 \
            -subj '/CN=Where Is School one-file delivery' -keyout job.key -out job.pem 2>/dev/null
          summary="$(jq -c --arg cert "$("$openssl_bin" base64 -A -in job.pem)" \
            '{file:., recipient_certificate:$cert}' IPA-verified.json)"
          gh api -X POST "repos/$GITHUB_REPOSITORY/check-runs" \
            -f "name=IPA recipient $GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" -f "head_sha=$GITHUB_SHA" \
            -f "details_url=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            -f status=completed -f conclusion=neutral -f 'output[title]=Verified IPA and one-run public certificate' \
            -f "output[summary]=$summary" --jq '.id'
      - name: Receive the signed and encrypted one-file delivery ticket
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: python3 .github/wis-livecontainer-preview-deliver.py receive "$RUNNER_TEMP/wis-private-delivery"
      - name: Upload the verified IPA to the authorized Drive file
        shell: bash
        run: python3 .github/wis-livecontainer-preview-deliver.py upload "$RUNNER_TEMP/wis-private-delivery"
      - name: Remove one-run transfer material
        if: always()
        shell: bash
        run: rm -rf -- "$RUNNER_TEMP/wis-private-delivery"

name: Deliver the LiveContainer iOS preview

# One build branch, one verified encrypted artifact, one destination file. This
# job never receives Apple signing credentials or Google account credentials.
on:
  push:
    branches: [arena/31215324-where-is-school]

permissions:
  actions: read
  contents: read

jobs:
  delivery:
    name: Upload the verified package to Drive
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      IPA_SHA256: 4a3fee83c943a987ecfe2a0368269322670e9a3e42e5397f4ddc17b652d71ada
      IPA_NAME: Where-Is-School-LiveContainer-a6cc5d6.ipa
      IPA_BYTES: '38137819'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Create a one-run recipient key for the file transfer ticket
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir "$RUNNER_TEMP/wis-transfer"
          cd "$RUNNER_TEMP/wis-transfer"
          openssl req -new -x509 -newkey rsa:3072 -nodes -sha256 -days 1 \
            -subj '/CN=Where Is School one-file delivery' -keyout job.key -out job.pem 2>/dev/null
          printf '::notice title=One-run delivery public certificate::%s\n' "$(base64 -w0 job.pem)"
      - name: Recover the verified ciphertext from the macOS runner
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh run download 44994282270 --repo "$GITHUB_REPOSITORY" \
            --name livecontainer-encrypted-44994282270-1 --dir "$RUNNER_TEMP/wis-transfer"
      - name: Receive the signed and encrypted delivery ticket
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/macos/ios/deliver_livecontainer_preview.py receive "$RUNNER_TEMP/wis-transfer"
      - name: Check the IPA digest and upload only that file
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/macos/ios/deliver_livecontainer_preview.py upload "$RUNNER_TEMP/wis-transfer"
      - name: Remove temporary delivery keys
        if: always()
        shell: bash
        run: rm -rf -- "$RUNNER_TEMP/wis-transfer"

name: Location art capture

# Photographs the exterior route and school rooms around an environment change,
# from the game's own camera, so an art round can be judged on frames rather than on
# descriptions. `tests/capture_locations.gd` takes the frames; see its header.
#
# One job per (location, side). "before" is the pull request's base commit (or the
# `base` input of a manual run) with this branch's capture script copied in, so both
# sides stand the player on the same derived spots; "after" is the commit under test.
#
# Like `Playthrough capture`, the frames are not committed by Actions. Each job uploads
# them as an artifact and also publishes them inline as small JPEGs through notice
# annotations (an annotation holds about 4 KB, so each image is base64 split into
# numbered parts: concatenate the parts of one file in order and decode them). That
# second route exists because annotations can be read through the REST API from places
# that cannot reach the artifact store. Reviewed frames are committed by a person, under
# `docs/screenshots/map_art/`, as evidence for the round that made them.

on:
  pull_request:
    paths:
      - "tests/capture_locations.gd"
      - "tests/ticket_counter_test.gd"
      - "scenes/locations/laboratory/**"
      - "scenes/locations/staff_office/**"
      - "scenes/locations/restroom/**"
      - "scenes/locations/archive/**"
      - "scenes/locations/plan_room/**"
      - "scenes/locations/projection_room/**"
      - "scenes/locations/computer_room/**"
      - "scenes/locations/vacant_office/**"
      - "scenes/locations/principal_office/**"
      - "scenes/locations/restroom_02/**"
      - "scenes/locations/restroom_03/**"
      - "scenes/locations/site_interior/**"
      - "data/inspections/*/site_interior.json"
      - "scenes/locations/container_yard/**"
      - "data/inspections/*/container_yard.json"
      - "scenes/locations/port/**"
      - "data/inspections/*/port.json"
      - "assets/shaders/school/**"
      - "tests/location_art_test.gd"
      - "tests/school_rooms_test.gd"
      - "tests/school_facilities_test.gd"
      - "tests/playground_art_slice_test.gd"
      - "tests/return_route_test.gd"
      - "assets/camera/shots/return_board.tres"
      - "data/inspections/*/street.json"
      - "data/inspections/*/alley.json"
      - "data/inspections/*/playground.json"
      - "data/dialogue/*/playground.json"
      - ".github/workflows/location-art-capture.yml"
      - "scenes/locations/corridor/**"
      - "scenes/locations/street/**"
      - "scenes/locations/residential/**"
      - "scenes/locations/alley/**"
      - "scenes/locations/playground/**"
      - "scenes/environment/props/**"
  workflow_dispatch:
    inputs:
      base:
        description: "Commit or ref photographed as 'before'"
        required: false
        default: "main"
      relay_ticket_evidence:
        description: "Run the ticket visit and relay original JPEGs for Drive or offline review"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  capture:
    if: inputs.relay_ticket_evidence != true
    name: ${{ matrix.location }} (${{ matrix.side }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        location: [corridor, street, residential, alley, playground]
        side: [before, after]
        include:
          - {location: laboratory, side: before}
          - {location: laboratory, side: after}
          - {location: staff_office, side: after}
          - {location: restroom, side: after}
          - {location: staff_office, side: forward-plus}
          - {location: restroom, side: forward-plus}
          - {location: archive, side: after}
          - {location: plan_room, side: after}
          - {location: projection_room, side: after}
          - {location: projection_room, side: forward-plus}
          - {location: computer_room, side: after}
          - {location: computer_room, side: forward-plus}
          - {location: vacant_office, side: after}
          - {location: principal_office, side: after}
          - {location: restroom_02, side: after}
          - {location: restroom_03, side: after}
          - {location: dream_annex, side: after}
          - {location: annex_thresholds, side: before}
          - {location: annex_thresholds, side: after}
          - {location: playground_site, side: after}
          - {location: playground_site, side: forward-plus}
          - {location: site_interior, side: after}
          - {location: site_interior, side: forward-plus}
          - {location: container_yard, side: after}
          - {location: container_yard, side: forward-plus}
          - {location: port, side: after}
          - {location: port, side: forward-plus}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      # The engine is installed before either side of the matrix touches the working tree:
      # `.github/actions/setup-godot` is a local action, and `actions/checkout` plus the
      # `git checkout` below replace the tree it is read from. The "before" leg checks out
      # the base commit, which predates this action (issue #217), so a local action after
      # that point would not be found at all. Installing first keeps the engine identical
      # for both sides, which is what makes the comparison mean anything.
      - uses: ./.github/actions/setup-godot

      - name: Check out the "before" commit, keeping this branch's capture script
        if: matrix.side == 'before'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || inputs.base }}
        run: |
          set -euo pipefail
          cp tests/capture_locations.gd "${RUNNER_TEMP}/capture_locations.gd"
          git fetch --no-tags origin "${BASE_SHA}" || true
          git checkout --detach "${BASE_SHA}" 2>/dev/null || git checkout --detach "origin/${BASE_SHA}"
          cp "${RUNNER_TEMP}/capture_locations.gd" tests/capture_locations.gd
          echo "before = $(git rev-parse HEAD)"

      - name: Import
        shell: bash
        run: |
          # `--import` waits for the queue to drain; its exit code is not the verdict (the
          # project theme can load before its font is imported). The second pass is.
          godot --headless --path . --import > "${RUNNER_TEMP}/import-1.log" 2>&1 || true
          godot --headless --editor --path . --quit > "${RUNNER_TEMP}/import-2.log" 2>&1 || true
          grep -E "SCRIPT ERROR|Parse Error" "${RUNNER_TEMP}/import-2.log" | head -n 20 || true

      - name: Install software Vulkan for the Forward+ room checks
        if: matrix.side == 'forward-plus'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mesa-vulkan-drivers

      - name: Capture
        shell: bash
        env:
          LOCATION: ${{ matrix.location }}
          SIDE: ${{ matrix.side }}
        run: |
          set +e -uo pipefail
          renderer=(--rendering-driver opengl3)
          if [ "$SIDE" = forward-plus ]; then
            renderer=(--rendering-method forward_plus --rendering-driver vulkan)
          fi
          width=960
          case "$LOCATION" in
            corridor|laboratory|staff_office|restroom)
              detail=(school-details review_width=440)
              width=1600
              expect=2
              if [ "$LOCATION" = corridor ] || [ "$LOCATION" = laboratory ]; then expect=4; fi
              if [ "$LOCATION" != corridor ] && [ "$SIDE" != before ]; then
                detail+=(school-focus)
                expect=5
              fi
              ;;
            archive|plan_room|projection_room|computer_room|vacant_office|principal_office)
              detail=(school-details school-focus review_width=380)
              width=1600
              expect=3
              if [ "$LOCATION" = projection_room ]; then expect=4; fi
              ;;
            annex_thresholds)
              detail=(annex-thresholds review_width=360)
              width=1280
              expect=7
              ;;
            dream_annex)
              # Two live locations: preserve the overview and add authored 03 pose plates.
              detail=(dream-annex review_width=440)
              width=1280
              expect=17
              ;;
            playground_site)
              # The building under construction past the yard's south-west corner
              # One gameplay stance, matched exterior views, four detail views and the
              # gameplay shot that frames the whole building from the yard edge.
              detail=(construction-site review_width=500)
              width=1280
              expect=10
              ;;
            site_interior)
              # Inside the building under construction: three stances (porch, key,
              # light column), five fixed views, and the yard's gate opened by the key.
              detail=(site-interior review_width=500)
              width=1280
              expect=9
              ;;
            container_yard)
              # The container yard: six fixed views (overhead maze, corner, tyre stairs, the
              # long plank, roofs, the high plank), four follow-camera stances, and the way in
              # from the schoolyard (a stance and a view).
              detail=(container-yard review_width=380)
              width=1280
              expect=12
              ;;
            port)
              # The port: six fixed views (the quay from high up, the sea from the pier,
              # the crane, the ship, the water from overhead, the truck), five follow-camera
              # stances, and the yard's truck that takes you there (a stance and a view).
              detail=(port review_width=380)
              width=1280
              expect=13
              ;;
            restroom_02|restroom_03)
              detail=(school-details review_width=380)
              width=1600
              expect=2
              ;;
            *)
              detail=(return-route review_width=460)
              expect=2
              if [ "$LOCATION" = playground ]; then expect=3; fi
              if [ "$LOCATION/$SIDE" = playground/after ]; then
                detail+=(return-board-focus)
                expect=4
              fi
              ;;
          esac
          xvfb-run -a --server-args="-screen 0 1600x900x24" \
            godot --path . --resolution 1600x900 "${renderer[@]}" --audio-driver Dummy \
            --script res://tests/capture_locations.gd -- \
            "label=${SIDE}" "only=${LOCATION}" spots=3 "width=${width}" quality=0.84 "${detail[@]}" \
            > "${RUNNER_TEMP}/capture.log" 2>&1
          code=$?
          grep -E "LOCATION_CAPTURE|PASS|FAIL|SCRIPT ERROR|ERROR:" "${RUNNER_TEMP}/capture.log" | head -n 60
          out="docs/screenshots/map_art/${SIDE}"
          shopt -s nullglob
          frames=("$out/""${LOCATION}"_*.jpg)
          views=("$out/review/""${LOCATION}"_*_detail_*.jpg)
          if [ "$code" -ne 0 ] || [ "${#frames[@]}" -lt 2 ] || [ "${#views[@]}" -ne "$expect" ] || \
              grep -Eq 'SCRIPT ERROR|TEST FAILURE|^FAIL:|^ERROR:' "${RUNNER_TEMP}/capture.log" || \
              ! grep -q '^PASS:' "${RUNNER_TEMP}/capture.log"; then
            tail -n 40 "${RUNNER_TEMP}/capture.log"
            awk '/^(SCRIPT ERROR|TEST FAILURE|FAIL:|ERROR:|res:\/\/data\/)/ {print; if (++count == 6) exit}' \
              "${RUNNER_TEMP}/capture.log" | while read -r issue; do
              echo "::error title=location capture diagnostic::$issue"
            done
            echo "::error title=location capture::$LOCATION/$SIDE wrote ${#frames[@]} frames, ${#views[@]}/$expect detail frames, exit $code"
            exit 1
          fi
          inline="${RUNNER_TEMP}/review"
          mkdir -p "$inline" "${RUNNER_TEMP}/frames"
          cp "${frames[@]}" "$out/LOCATIONS.md" "${RUNNER_TEMP}/frames/"
          cp "${views[@]}" "$inline/"
          if [ "${LOCATION}/${SIDE}" = corridor/after ]; then
            wing="docs/screenshots/map_art/teaching-wing"
            xvfb-run -a --server-args="-screen 0 1600x900x24" \
              godot --path . --resolution 1600x900 --rendering-driver opengl3 --audio-driver Dummy \
              --script res://tests/capture_locations.gd -- \
              label=teaching-wing teaching-wing width=960 quality=0.84 review_width=400 \
              > "${RUNNER_TEMP}/teaching-wing.log" 2>&1
            wing_code=$?
            shots=$(find "$wing" -maxdepth 1 -name 'teaching_wing_*.jpg' 2>/dev/null | wc -l)
            if [ "$wing_code" -ne 0 ] || [ "$shots" -ne 8 ] || \
                grep -Eq 'SCRIPT ERROR|TEST FAILURE|^FAIL:|^ERROR:' "${RUNNER_TEMP}/teaching-wing.log" || \
                ! grep -q '^PASS:' "${RUNNER_TEMP}/teaching-wing.log"; then
              tail -n 40 "${RUNNER_TEMP}/teaching-wing.log"
              echo "::error title=teaching wing capture::wrote ${shots}/8 frames, exit ${wing_code}"
              exit 1
            fi
            cp "$wing"/*.jpg "${RUNNER_TEMP}/frames/"
            cp "$wing/LOCATIONS.md" "${RUNNER_TEMP}/frames/teaching-wing-index.md"
            cp "${RUNNER_TEMP}/teaching-wing.log" "${RUNNER_TEMP}/frames/"
            cp "$wing/review/"*.jpg "$inline/"
            echo "::notice title=teaching wing capture::${shots} full-size frames, including the close views of 01, 02 and 03"
          fi
          if [ "${LOCATION}/${SIDE}" = corridor/after ]; then
            service="${RUNNER_TEMP}/service"
            xvfb-run -a --server-args="-screen 0 1600x900x24" \
              godot --path . --resolution 1600x900 --rendering-driver opengl3 --audio-driver Dummy \
              --script res://tests/school_facilities_test.gd -- "capture=${service}" \
              > "${RUNNER_TEMP}/service.log" 2>&1
            service_code=$?
            service_shots=("$service/"service_*.jpg)
            if [ "$service_code" -ne 0 ] || [ "${#service_shots[@]}" -ne 6 ] || \
                grep -Eq 'SCRIPT ERROR|TEST FAILURE|^FAIL:|^ERROR:' "${RUNNER_TEMP}/service.log" || \
                ! grep -q '^PASS:' "${RUNNER_TEMP}/service.log"; then
              tail -n 45 "${RUNNER_TEMP}/service.log"
              awk '/^(SCRIPT ERROR|TEST FAILURE|FAIL:|ERROR:)/ {print; if (++count == 6) exit}' \
                "${RUNNER_TEMP}/service.log" | while read -r issue; do
                  echo "::error title=school facilities::$issue"
                done
              exit 1
            fi
            cp "${service_shots[@]}" "${RUNNER_TEMP}/service.log" "${RUNNER_TEMP}/frames/"
            cp "$service/review/"*.jpg "$inline/"
            echo "::notice title=school facilities::6 real game-camera images: both controls, three stages apiece"
          fi
          # Keep full-size frames in the artifact. Use compact detail copies within
          # the inline annotation budget.
          queue="${RUNNER_TEMP}/queue.txt"
          : > "${queue}"
          # Mechanisms and crowd poses go first; the artifact still holds every view.
          priority=("$inline"/service_*.jpg "$inline"/*_shot_detail_*.jpg "$inline"/*_detail_exam_conversation.jpg
                    "$inline"/*_detail_exam_revision*.jpg "$inline"/*_detail_waiting_*.jpg
                    "$inline"/*_detail_exam_plaster_pair.jpg)
          for path in "$inline"/*.jpg; do
            case "${path##*/}" in
              service_*|*_shot_detail_*.jpg|*_detail_exam_conversation.jpg|*_detail_exam_revision*.jpg|*_detail_waiting_*.jpg|*_detail_exam_plaster_pair.jpg) ;;
              *) priority+=("$path") ;;
            esac
          done
          for path in "${priority[@]}"; do
            file=${path##*/}
            data=$(base64 -w0 "$path")
            parts=$(( (${#data} + 3999) / 4000 ))
            for i in $(seq 1 "${parts}"); do
              echo "${SIDE}/${file} ${i}/${parts} ${data:$(( (i - 1) * 4000 )):4000}" >> "${queue}"
            done
          done
          echo "queued $(wc -l < "${queue}") annotation part(s)"

      # GitHub keeps at most 10 notices per step and 50 annotations per job, so the parts
      # are spread over four steps of ten. A frame whose parts do not all fit is
      # incomplete in the annotations; the artifact still has it.
      - name: Publish frames 1/4
        if: always()
        shell: bash
        run: sed -n '1,10p' "${RUNNER_TEMP}/queue.txt" 2>/dev/null | while read -r file part data; do echo "::notice title=frame ${file} part ${part}::${data}"; done
      - name: Publish frames 2/4
        if: always()
        shell: bash
        run: sed -n '11,20p' "${RUNNER_TEMP}/queue.txt" 2>/dev/null | while read -r file part data; do echo "::notice title=frame ${file} part ${part}::${data}"; done
      - name: Publish frames 3/4
        if: always()
        shell: bash
        run: sed -n '21,30p' "${RUNNER_TEMP}/queue.txt" 2>/dev/null | while read -r file part data; do echo "::notice title=frame ${file} part ${part}::${data}"; done
      - name: Publish frames 4/4
        if: always()
        shell: bash
        run: |
          sed -n '31,40p' "${RUNNER_TEMP}/queue.txt" 2>/dev/null | while read -r file part data; do echo "::notice title=frame ${file} part ${part}::${data}"; done
          total=$(wc -l < "${RUNNER_TEMP}/queue.txt" 2>/dev/null || echo 0)
          if [ "${total}" -gt 40 ]; then
            echo "${total} parts queued, 40 published; the rest are only in the artifact"
          fi

      - name: Upload frames
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: location-frames-${{ matrix.location }}-${{ matrix.side }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/frames/
            ${{ runner.temp }}/capture.log
          if-no-files-found: warn

  # `tests/location_art_test.gd` is not in `godot-ci.yml` yet (another open pull request
  # is changing that file), so this workflow runs it until it is registered there.
  art-test:
    if: inputs.relay_ticket_evidence != true
    name: location art test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: ./.github/actions/setup-godot

      - name: Import
        shell: bash
        run: |
          godot --headless --path . --import > "${RUNNER_TEMP}/import-1.log" 2>&1 || true
          godot --headless --editor --path . --quit > "${RUNNER_TEMP}/import-2.log" 2>&1 || true
          grep -E "SCRIPT ERROR|Parse Error" "${RUNNER_TEMP}/import-2.log" | head -n 20 || true

      # Room frames alone cannot prove that reading, save/continue and both returns work.
      - name: Walk and restore in both fitted rooms
        shell: bash
        run: |
          set +e
          source tools/ci_run_check.sh
          status=0
          run_check fitted_rooms 240 godot --headless --path . --script res://tests/school_rooms_test.gd || status=$?
          touch ci-logs/fitted_rooms.log
          grep -E "TEST FAILURE|SCRIPT ERROR|Parse Error" ci-logs/fitted_rooms.log | head -n 8 \
            | while IFS= read -r line; do echo "::error title=fitted rooms::${line}"; done
          grep -E "^PASS:|^FAIL:" ci-logs/fitted_rooms.log \
            | while IFS= read -r line; do echo "::notice title=fitted rooms::${line}"; done
          exit "$status"

      - name: Location art test
        shell: bash
        run: |
          # No `set -u`: the sourced helper reads optional variables.
          set +e
          source tools/ci_run_check.sh
          status=0
          run_check location_art 540 godot --headless --path . --script res://tests/location_art_test.gd || status=$?
          touch ci-logs/location_art.log
          # The verdict lines as annotations, readable through the REST API.
          grep -E "TEST FAILURE|SCRIPT ERROR|Parse Error" ci-logs/location_art.log | head -n 9 \
            | while IFS= read -r line; do echo "::error title=location art::${line}"; done
          grep -E "PASS:|FAIL:|location art:|spots, " ci-logs/location_art.log | head -n 9 \
            | while IFS= read -r line; do echo "::notice title=location art::${line}"; done
          if [ "${status}" -ne 0 ]; then
            echo "::warning title=location art::exit ${status}; $(wc -l < ci-logs/location_art.log) log lines"
            tail -n 12 ci-logs/location_art.log | cut -c1-300 \
              | while IFS= read -r line; do echo "::warning title=location art tail::${line}"; done
          fi
          exit "${status}"

      - name: Playground collision and follow-camera regression
        shell: bash
        if: always()
        run: |
          source tools/ci_run_check.sh
          run_check playground_art_slice 300 godot --headless --path . --script res://tests/playground_art_slice_test.gd || status=1
          run_check_summary

      - name: Return route interaction and branching
        shell: bash
        if: always()
        run: |
          source tools/ci_run_check.sh
          status=0
          run_check return_route 300 godot --headless --path . --script res://tests/return_route_test.gd || status=$?
          awk '/return route:|^PASS:|^FAIL:|TEST FAILURE|SCRIPT ERROR/ && n++ < 8 {print}' ci-logs/return_route.log \
            | while IFS= read -r line; do echo "::notice title=return route::${line}"; done
          if grep -Eq '^ERROR:|^WARNING: ObjectDB instances leaked' ci-logs/return_route.log; then
            awk '/^ERROR:|^WARNING: ObjectDB instances leaked/ {if (!at) at=NR} at && NR < at+8 {print}' ci-logs/return_route.log \
              | while IFS= read -r line; do echo "::error title=return route engine error::${line}"; done
            status=1
          fi
          exit "$status"

      - name: Upload art regression logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: location-art-regressions
          path: ci-logs/
          if-no-files-found: warn

  ticket-visit:
    name: Play through the 01 ticket counter
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      shards: ${{ steps.pack.outputs.shards }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: ./.github/actions/setup-godot

      - name: Import project resources
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --import > "${RUNNER_TEMP}/import-1.log" 2>&1 || true
          godot --headless --editor --path . --quit > "${RUNNER_TEMP}/import-2.log" 2>&1 || true
          if grep -E "SCRIPT ERROR|Parse Error" "${RUNNER_TEMP}/import-2.log"; then exit 1; fi

      - name: Verify the original gallery route and desktop and touch input before review
        if: inputs.relay_ticket_evidence
        shell: bash
        run: |
          set -euo pipefail
          verify() {
            local check="$1"; shift
            local log="${RUNNER_TEMP}/ticket-${check}.log"
            if ! godot --headless --path . --script "$@" > "$log" 2>&1 || \
                grep -Eq 'SCRIPT ERROR|TEST FAILURE|^FAIL:' "$log" || ! grep -q '^PASS:' "$log"; then
              tail -n 45 "$log"
              awk '/^(SCRIPT ERROR|TEST FAILURE|FAIL:|ERROR:)/ {print; if (++count == 6) exit}' "$log" \
                | while IFS= read -r issue; do echo "::error title=${check}::${issue}"; done
              exit 1
            fi
            grep -E '^PASS:|^TICKET SHOT:' "$log" \
              | while IFS= read -r line; do echo "::notice title=${check}::${line}"; done
          }
          verify gallery res://tests/dream_annex_test.gd
          verify desktop res://tests/ticket_counter_test.gd
          verify touch res://tests/ticket_counter_test.gd -- --mobile-preview

      - name: Walk through the glass door and click the three faces
        shell: bash
        run: |
          set +e -uo pipefail
          tickets="${RUNNER_TEMP}/tickets"
          xvfb-run -a --server-args="-screen 0 1600x900x24" \
            godot --path . --resolution 1600x900 --rendering-driver opengl3 --audio-driver Dummy \
            --script res://tests/ticket_counter_test.gd -- "capture=${tickets}" \
            > "${RUNNER_TEMP}/tickets.log" 2>&1
          code=$?
          tail -n 45 "${RUNNER_TEMP}/tickets.log"
          shopt -s nullglob
          shots=("$tickets/"ticket_shot_detail_*.jpg)
          if [ "$code" -ne 0 ] || [ "${#shots[@]}" -ne 4 ] || \
              grep -Eq 'SCRIPT ERROR|TEST FAILURE|^FAIL:|^ERROR:' "${RUNNER_TEMP}/tickets.log" || \
              ! grep -q '^PASS:' "${RUNNER_TEMP}/tickets.log"; then
            awk '/^(SCRIPT ERROR|TEST FAILURE|FAIL:|ERROR:)/ {print; if (++count == 6) exit}' \
              "${RUNNER_TEMP}/tickets.log" | while IFS= read -r issue; do
                echo "::error title=ticket counter::${issue}"
              done
            echo "::error title=ticket counter::Expected four gameplay JPEGs and a passing test, got ${#shots[@]} files (exit ${code})"
            exit 1
          fi
          grep -E '^TICKET SHOT:|^EVIDENCE ' "${RUNNER_TEMP}/tickets.log" | while IFS= read -r record; do
            echo "::notice title=ticket gameplay::${record}"
          done

      - name: Pack original frames for the opt-in relay
        id: pack
        if: inputs.relay_ticket_evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/dialogue_evidence_relay.py pack --set tickets \
            --log "${RUNNER_TEMP}/tickets.log" --frames "${RUNNER_TEMP}/tickets" --out "${RUNNER_TEMP}/ticket-relay"

      - name: Upload original ticket frames
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ticket-counter-frames-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/tickets/
            ${{ runner.temp }}/tickets.log
            ${{ runner.temp }}/ticket-relay/queue.txt
          if-no-files-found: error

  # Opt-in only, as with the opening/clock relays. Exposes the exact full-size artifact
  # bytes through GitHub's check API when the artifact store cannot be reached from here.
  ticket-relay:
    name: Relay ticket frames (shard ${{ matrix.shard }})
    needs: ticket-visit
    if: inputs.relay_ticket_evidence && needs.ticket-visit.outputs.shards != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.ticket-visit.outputs.shards) }}
    env:
      SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ticket-counter-frames-${{ github.run_attempt }}
          path: ${{ runner.temp }}/evidence
      - name: Select this shard of 45 parts
        shell: bash
        run: |
          set -euo pipefail
          queue=$(find "${RUNNER_TEMP}/evidence" -name queue.txt -type f -print -quit)
          test -s "$queue"
          sed -n "$(( SHARD * 45 + 1 )),$(( (SHARD + 1) * 45 ))p" "$queue" > "${RUNNER_TEMP}/shard.txt"
          test -s "${RUNNER_TEMP}/shard.txt"
      - name: Publish 1/5
        run: sed -n '1,9p' "${RUNNER_TEMP}/shard.txt" | while read -r file part data; do echo "::notice title=relay ${file} ${part}::${data}"; done
      - name: Publish 2/5
        run: sed -n '10,18p' "${RUNNER_TEMP}/shard.txt" | while read -r file part data; do echo "::notice title=relay ${file} ${part}::${data}"; done
      - name: Publish 3/5
        run: sed -n '19,27p' "${RUNNER_TEMP}/shard.txt" | while read -r file part data; do echo "::notice title=relay ${file} ${part}::${data}"; done
      - name: Publish 4/5
        run: sed -n '28,36p' "${RUNNER_TEMP}/shard.txt" | while read -r file part data; do echo "::notice title=relay ${file} ${part}::${data}"; done
      - name: Publish 5/5
        run: sed -n '37,45p' "${RUNNER_TEMP}/shard.txt" | while read -r file part data; do echo "::notice title=relay ${file} ${part}::${data}"; done

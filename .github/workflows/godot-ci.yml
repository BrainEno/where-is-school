name: Godot CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Import, smoke test, and gameplay tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Godot
        uses: chickensoft-games/setup-godot@v2.4.3
        with:
          version: 4.7.2
          use-dotnet: false

      # Each command runs under `timeout` so a stalled test fails visibly instead of
      # consuming the job budget. Results are echoed to stdout and to the check
      # run's annotations, which makes failures readable from the API as well as
      # from the web log view.
      - name: Import and run headless checks
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p ci-logs

          run_check () {
            local name="$1"; shift
            local limit="$1"; shift
            echo "=== ${name}: $*"
            timeout "${limit}" "$@" > "ci-logs/${name}.log" 2>&1
            local code=$?
            tail -n 30 "ci-logs/${name}.log"
            echo "--- exit ${code}"
            printf '%s=%s\n' "$name" "$code" >> ci-logs/results.txt
            local summary
            summary=$(grep -E "TEST FAILURE|TEST WATCHDOG|SCRIPT ERROR|Parse Error|ERROR:|DIAG|FAIL:|PASS:" \
              "ci-logs/${name}.log" | head -n 40 | tr '\n' '|' | cut -c1-4000)
            if [ "${code}" -eq 0 ]; then
              echo "${name} passed"
            else
              echo "::error title=${name} failed (exit ${code})::${summary:-no summary captured}"
              echo "${summary}"
            fi
            return "${code}"
          }

          status=0
          run_check import 420 godot --headless --editor --path . --quit || status=1
          run_check smoke 180 godot --headless --path . --script res://tests/smoke_test.gd || status=1
          run_check narrative_state 180 godot --headless --path . --script res://tests/narrative_state_test.gd || status=1
          run_check content 180 godot --headless --path . --script res://tests/dialogue_content_test.gd || status=1
          run_check dialogue_runtime 180 godot --headless --path . --script res://tests/dialogue_runtime_test.gd || status=1
          run_check dialogue_validation 180 godot --headless --path . --script res://tests/dialogue_validation_test.gd || status=1
          run_check dialogue_parity 120 godot --headless --path . --script res://tests/dialogue_parity_test.gd || status=1
          run_check inner_abilities 180 godot --headless --path . --script res://tests/inner_abilities_test.gd || status=1
          run_check playground_flow 300 godot --headless --path . --script res://tests/playground_flow_test.gd || status=1
          run_check capture_pipeline 120 python3 tests/test_capture_ci.py || status=1
          run_check i18n 120 godot --headless --path . --script res://tests/i18n_test.gd || status=1
          run_check language_switch 300 godot --headless --path . --script res://tests/language_switch_test.gd || status=1
          run_check opening_flow 420 godot --headless --path . --script res://tests/opening_flow_test.gd || status=1

          echo "overall status: ${status}"
          summary=$(tr '\n' ' ' < ci-logs/results.txt)
          echo "::notice title=Headless check exit codes::${summary}"
          printf '## Headless check exit codes\n\n```\n%s\n```\n' "$(cat ci-logs/results.txt)" >> "$GITHUB_STEP_SUMMARY"
          exit "${status}"

      - name: Upload headless test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-ci-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-logs/
          if-no-files-found: warn

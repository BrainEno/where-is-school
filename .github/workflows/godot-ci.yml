name: Godot CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Import, smoke test, and gameplay tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Godot
        uses: chickensoft-games/setup-godot@v2.4.3
        with:
          version: 4.7.2
          use-dotnet: false

      - name: Static syntax check
        id: parse
        shell: bash
        run: |
          # The engine's import pass only compiles the scripts something actually
          # loads, so a broken file nothing references can sit in the tree and the
          # import still exits 0. gdtoolkit's parser reads every file, without
          # needing a display or an engine instance. It is a CI-only tool: nothing
          # from it ships with the game.
          set -uo pipefail
          python3 -m venv /tmp/lint >/dev/null 2>&1
          /tmp/lint/bin/pip install --quiet "gdtoolkit==4.5.0"
          # `addons/` is included: the repository's only addon is first-party code
          # (`addons/narrative_editor`, the editor dock) and a broken file there is a
          # broken editor for the author, not a third-party problem to ignore.
          mapfile -t files < <(find . -name '*.gd' -not -path './.godot/*' | sort)
          echo "checking ${#files[@]} GDScript file(s)"
          if ! /tmp/lint/bin/gdparse "${files[@]}"; then
            echo "PARSE_RESULT=failure"
            echo "::error title=GDScript syntax::gdparse rejected at least one file (see the step log)"
            exit 1
          fi
          echo "PARSE_RESULT=success"

      - name: Check the sample models are reproducible
        shell: bash
        run: |
          # The committed .glb files are build artefacts of a checked-in script. If the
          # two ever disagree, the provenance recorded in docs/ASSET_PROVENANCE.md is
          # describing a file nobody can rebuild.
          python3 tools/build_sample_models.py --check

      - name: Check the bundled font covers the current text
        shell: bash
        run: |
          # The font that ships is a 325 KiB subset of the 10 MB upstream one, rebuilt by
          # tools/subset_font.py from every character the project can put on screen. Text
          # that needs a character the subset does not carry would render as a tofu box in
          # a *build*, where no test would ever see it. This step fails on exactly that,
          # naming the characters, and tells you the command that fixes it.
          #
          # It also fails when a font bigger than 2 MiB sits under assets/, which is what
          # the unsplit source font would look like if it were ever moved back.
          set -uo pipefail
          /tmp/lint/bin/pip install --quiet "fonttools==4.58.5"
          /tmp/lint/bin/python tools/subset_font.py --check

      # Each command runs under `timeout` so a stalled test fails visibly instead of
      # consuming the job budget. Results are echoed to stdout and to the check
      # run's annotations, which makes failures readable from the API as well as
      # from the web log view.
      - name: Import and run headless checks
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p ci-logs

          run_check () {
            local name="$1"; shift
            local limit="$1"; shift
            echo "=== ${name}: $*"
            timeout "${limit}" "$@" > "ci-logs/${name}.log" 2>&1
            local code=$?
            tail -n 30 "ci-logs/${name}.log"
            echo "--- exit ${code}"
            local summary
            # Prefer the test's own verdict lines. Engine ERROR noise (a freed-node
            # warning repeated every frame) can be hundreds of lines long and would
            # otherwise push the real failure out of the check annotation.
            # `SCRIPT ERROR` belongs in the summary: an uncaught runtime error kills
            # the test's coroutine without printing a verdict, and the run then looks
            # like a silent timeout. Without this line the only visible symptom is the
            # watchdog, which says nothing about the cause.
            summary=$(grep -E "TEST FAILURE|TEST WATCHDOG|FAIL:|SCRIPT ERROR|Parse Error|PASS:" \
              "ci-logs/${name}.log" | head -n 20 | tr '\n' '|' | cut -c1-4000)
            if [ -z "${summary}" ]; then
              summary=$(grep -E "SCRIPT ERROR|ERROR:" "ci-logs/${name}.log" \
                | head -n 12 | tr '\n' '|' | cut -c1-4000)
            fi
            grep -E "TEST FAILURE|TEST WATCHDOG|FAIL:" "ci-logs/${name}.log" | head -n 20 || true
            if [ "${code}" -eq 0 ]; then
              echo "::notice title=${name} passed::$(tail -n 2 "ci-logs/${name}.log" | tr '\n' ' ' | cut -c1-500)"
            else
              echo "::error title=${name} failed (exit ${code})::${summary:-no summary captured}"
              echo "${summary}"
            fi
            return "${code}"
          }

          status=0
          # The import has to be *blocking*. `--editor --quit` returns after one frame,
          # while the first filesystem scan is still running on its worker thread, so
          # `.godot/imported/` stays empty. That was harmless while no `.import` sidecar
          # was tracked: an asset without a sidecar is loaded from the source file by its
          # own loader. With the sidecars committed it stops being harmless, because a
          # sidecar makes the engine resolve the path through `.godot/imported/...` and
          # never fall back to the source — so the font, the GLBs and the WAVs all
          # became "non-existent" for the tests further down. `--import` is the engine's
          # own "import, then quit" mode and it waits for the queue to drain.
          # Its exit code is not the verdict: the project theme is loaded at start-up,
          # before the font it points at has been imported, so a first-pass error there
          # is expected. The audit right after is the verdict.
          run_check import 420 godot --headless --path . --import || true

          # Every committed `.import` names the file Godot must produce for it. A sidecar
          # whose file is missing is exactly the state described above, and it is silent:
          # the import log looks fine and the failure only shows up later, in whatever
          # test happens to load that asset, pointing at the asset instead of the import.
          echo "=== import audit: every committed .import must have its imported file"
          missing=0
          while IFS= read -r sidecar; do
            while IFS= read -r dest; do
              if [ -z "${dest}" ]; then
                continue
              fi
              if [ ! -f "${dest#res://}" ]; then
                echo "MISSING ${dest} (declared by ${sidecar})"
                missing=1
              fi
            done < <(grep -o 'res://\.godot/imported/[^"]*' "${sidecar}" | sort -u)
          done < <(find . -name '*.import' -not -path './.godot/*' | sort)
          if [ "${missing}" -ne 0 ]; then
            echo "IMPORT_AUDIT=failure"
            echo "::error title=import audit::a committed .import sidecar has no imported file (see the MISSING lines)"
            status=1
          else
            echo "IMPORT_AUDIT=success"
          fi
          run_check smoke 180 godot --headless --path . --script res://tests/smoke_test.gd || status=1
          run_check narrative_state 180 godot --headless --path . --script res://tests/narrative_state_test.gd || status=1
          run_check content 180 godot --headless --path . --script res://tests/dialogue_content_test.gd || status=1
          run_check dialogue_runtime 180 godot --headless --path . --script res://tests/dialogue_runtime_test.gd || status=1
          run_check dialogue_validation 180 godot --headless --path . --script res://tests/dialogue_validation_test.gd || status=1
          run_check dialogue_parity 180 godot --headless --path . --script res://tests/dialogue_parity_test.gd || status=1
          run_check i18n 120 godot --headless --path . --script res://tests/i18n_test.gd || status=1
          run_check language_switch 480 godot --headless --path . --script res://tests/language_switch_test.gd || status=1
          run_check opening_flow 520 godot --headless --path . --script res://tests/opening_flow_test.gd || status=1
          run_check check_resolver 120 godot --headless --path . --script res://tests/check_resolver_test.gd || status=1
          run_check inner_abilities 120 godot --headless --path . --script res://tests/inner_abilities_test.gd || status=1
          run_check dialogue_check 180 godot --headless --path . --script res://tests/dialogue_check_test.gd || status=1
          run_check multi_voice 180 godot --headless --path . --script res://tests/multi_voice_test.gd || status=1
          run_check content_integrity 180 godot --headless --path . --script res://tests/content_integrity_test.gd || status=1
          run_check model_import 300 godot --headless --path . --script res://tests/model_import_test.gd || status=1
          run_check prop_asset 180 godot --headless --path . --script res://tests/prop_asset_test.gd || status=1
          run_check prop_placement 300 godot --headless --path . --script res://tests/prop_placement_test.gd || status=1
          run_check playground_flow 420 godot --headless --path . --script res://tests/playground_flow_test.gd || status=1
          run_check free_period 180 godot --headless --path . --script res://tests/free_period_test.gd || status=1
          run_check subjective_isolation 180 godot --headless --path . --script res://tests/subjective_isolation_test.gd || status=1
          run_check companion_route 300 godot --headless --path . --script res://tests/companion_route_test.gd || status=1
          run_check companion_obstacle 300 godot --headless --path . --script res://tests/companion_obstacle_test.gd || status=1
          run_check interaction_hover 240 godot --headless --path . --script res://tests/interaction_hover_test.gd || status=1
          run_check navigation 420 godot --headless --path . --script res://tests/navigation_test.gd || status=1
          run_check location_transition 420 godot --headless --path . --script res://tests/location_transition_test.gd || status=1
          run_check automatic_interaction 420 godot --headless --path . --script res://tests/automatic_interaction_test.gd || status=1
          run_check dialogue_pointer 300 godot --headless --resolution 1600x900 --path . --script res://tests/dialogue_pointer_test.gd || status=1
          run_check dialogue_layout 240 godot --headless --resolution 1600x900 --path . --script res://tests/dialogue_layout_test.gd || status=1
          run_check nameplate 180 godot --headless --path . --script res://tests/nameplate_test.gd || status=1
          run_check street_prompt 180 godot --headless --path . --script res://tests/street_prompt_test.gd || status=1
          run_check pointer_target_switch 300 godot --headless --resolution 1600x900 --path . --script res://tests/pointer_target_switch_test.gd || status=1
          run_check interaction_occlusion 300 godot --headless --resolution 1600x900 --path . --script res://tests/interaction_occlusion_test.gd || status=1
          run_check interaction_visibility_sweep 300 godot --headless --path . --script res://tests/interaction_visibility_sweep_test.gd || status=1
          # The two cues the mouse draws: their parts, their motion, their colour per
          # role, the ground they are laid on, and that they hide when finished.
          run_check interaction_cue 180 godot --headless --path . --script res://tests/interaction_cue_test.gd || status=1
          # The editor tool's data layer, driven headlessly against a user:// copy of the
          # real chapters: load, locate, edit, save, fail to save, and prove the files come
          # back byte-identical when nothing changed.
          run_check narrative_editor 300 godot --headless --path . --script res://tests/narrative_editor_test.gd || status=1
          # The strict field types and the per-field translation exception in the inner
          # voice registry.
          run_check ability_validation 180 godot --headless --path . --script res://tests/ability_validation_test.gd || status=1

          echo "overall status: ${status}"
          exit "${status}"

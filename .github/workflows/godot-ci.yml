name: Godot CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Import, smoke test, and gameplay tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Godot
        uses: chickensoft-games/setup-godot@v2.4.3
        with:
          version: 4.7.2
          use-dotnet: false

      - name: Import project and parse scripts
        run: godot --headless --editor --path . --quit

      - name: Run scene smoke test
        run: godot --headless --path . --script res://tests/smoke_test.gd

      - name: Run content, state, dialogue, and flow tests
        run: |
          set -euo pipefail
          for test in \
            res://tests/narrative_state_test.gd \
            res://tests/dialogue_content_test.gd \
            res://tests/dialogue_runtime_test.gd \
            res://tests/opening_flow_test.gd
          do
            echo "== ${test}"
            godot --headless --path . --script "${test}"
          done

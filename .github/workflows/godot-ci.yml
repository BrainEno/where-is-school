name: Godot CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Import, smoke test and logic tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Godot
        uses: chickensoft-games/setup-godot@v2.4.3
        with:
          version: 4.7.2
          use-dotnet: false

      - name: Import project and parse scripts
        run: godot --headless --editor --path . --quit

      - name: Smoke — main scene instantiates and composes the classroom
        run: godot --headless --path . --script res://tests/smoke_main.gd

      - name: Smoke — player, camera and interactables
        run: godot --headless --path . --script res://tests/smoke_player.gd

      - name: Smoke — UI group and lesson director
        run: godot --headless --path . --script res://tests/smoke_ui.gd

      - name: Run unit tests
        run: |
          set -e
          godot --headless --path . --script res://tests/game_state_test.gd
          godot --headless --path . --script res://tests/settings_test.gd
          godot --headless --path . --script res://tests/dialogue_runner_test.gd
          godot --headless --path . --script res://tests/dialogue_content_test.gd
          godot --headless --path . --script res://tests/scene_composition_test.gd

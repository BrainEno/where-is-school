name: Godot CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Import, smoke test and logic tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Godot
        uses: chickensoft-games/setup-godot@v2.4.3
        with:
          version: 4.7.2
          use-dotnet: false

      - name: Report engine version
        run: godot --version

      - name: Import project and parse scripts
        run: godot --headless --editor --path . --quit

      - name: Smoke — main scene instantiates the prologue
        run: godot --headless --path . --script res://tests/smoke_test.gd

      - name: Unit and integration tests
        run: godot --headless --path . --script res://tests/test_runner.gd

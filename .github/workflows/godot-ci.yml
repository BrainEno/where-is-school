name: Godot CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Import, smoke test and logic tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Godot
        uses: chickensoft-games/setup-godot@v2.4.3
        with:
          version: 4.7.2
          use-dotnet: false

      - name: Import project and parse scripts
        run: godot --headless --editor --path . --quit

      - name: Smoke — main scene instantiates and composes the classroom
        run: |
          set +e
          godot --headless --path . --script res://tests/smoke_main.gd > smoke_main.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            echo "::error::smoke_main.gd exited $code"
            grep -iE "ERROR|Failed|Parse|SCRIPT" smoke_main.log | head -9 | sed 's/^/::error::/'
            exit 1
          fi
          tail -n 3 smoke_main.log || true

      - name: Smoke — player, camera and interactables
        run: |
          set +e
          godot --headless --path . --script res://tests/smoke_player.gd > smoke_player.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            echo "::error::smoke_player.gd exited $code"
            grep -iE "ERROR|Failed|Parse|SCRIPT" smoke_player.log | head -9 | sed 's/^/::error::/'
            exit 1
          fi
          tail -n 3 smoke_player.log || true

      - name: Smoke — UI group and lesson director
        run: |
          set +e
          godot --headless --path . --script res://tests/smoke_ui.gd > smoke_ui.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            echo "::error::smoke_ui.gd exited $code"
            grep -iE "ERROR|Failed|Parse|SCRIPT" smoke_ui.log | head -9 | sed 's/^/::error::/'
            exit 1
          fi
          tail -n 3 smoke_ui.log || true

      - name: Run unit tests
        run: |
          set +e
          fail=0
          for t in game_state_test settings_test dialogue_runner_test dialogue_content_test scene_composition_test; do
            godot --headless --path . --script "res://tests/${t}.gd" > "test_${t}.log" 2>&1
            code=$?
            echo "== ${t}: exit ${code}"
            tail -n 2 "test_${t}.log" || true
            if [ $code -ne 0 ]; then
              echo "::error::${t}.gd exited $code"
              grep -iE "ERROR|Failed|Parse|SCRIPT|ASSERT" "test_${t}.log" | head -9 | sed 's/^/::error::/'
              fail=1
            fi
          done
          exit $fail

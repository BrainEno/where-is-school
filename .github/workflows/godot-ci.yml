name: Godot CI

on:
  push:
    branches: [main]
  # `pull_request` has no branch filter: a pull request whose base is another
  # branch - a stacked one - is still a pull request, and until this was removed the
  # only place it could be tested was the branch it was stacked on, or a manual
  # dispatch. `push` stays `main`-only, so nothing runs twice.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Import, smoke test, and gameplay tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Godot
        uses: chickensoft-games/setup-godot@v2.4.3
        with:
          version: 4.7.2
          use-dotnet: false

      - name: Static syntax check
        id: parse
        shell: bash
        run: |
          # The engine's import pass only compiles the scripts something actually
          # loads, so a broken file nothing references can sit in the tree and the
          # import still exits 0. gdtoolkit's parser reads every file, without
          # needing a display or an engine instance. It is a CI-only tool: nothing
          # from it ships with the game.
          set -uo pipefail
          python3 -m venv /tmp/lint >/dev/null 2>&1
          /tmp/lint/bin/pip install --quiet "gdtoolkit==4.5.0"
          # `addons/` is included: the repository's only addon is first-party code
          # (`addons/narrative_editor`, the editor dock) and a broken file there is a
          # broken editor for the author, not a third-party problem to ignore.
          mapfile -t files < <(find . -name '*.gd' -not -path './.godot/*' | sort)
          echo "checking ${#files[@]} GDScript file(s)"
          if ! /tmp/lint/bin/gdparse "${files[@]}"; then
            echo "PARSE_RESULT=failure"
            echo "::error title=GDScript syntax::gdparse rejected at least one file (see the step log)"
            exit 1
          fi
          echo "PARSE_RESULT=success"

      - name: Check the sample models are reproducible
        shell: bash
        run: |
          # The committed .glb files are build artefacts of a checked-in script. If the
          # two ever disagree, the provenance recorded in docs/ASSET_PROVENANCE.md is
          # describing a file nobody can rebuild.
          python3 tools/build_sample_models.py --check

      - name: Check the model library against the pipeline contract
        shell: bash
        run: |
          # Every `.glb` under assets/models/ is read here, before anything imports it. A
          # model that carries a camera, a light, a 2x node scale, or 4K textures embedded
          # in it used to be discovered by a red export job weeks later; the budgets this
          # applies are `tools/verify_build.py`'s own (imported, not copied), so the number
          # that fails a release now fails the commit that added the file.
          python3 tools/model_library.py --check

      - name: Check the repository stays small
        shell: bash
        run: |
          # Issue #97: 169 MB -> 433 MB in ten hours, most of it binaries committed at full
          # size on every change. The pack budget in tools/verify_build.py only sees what
          # ships, and a source file never does, so nothing stopped a 70.6 MB model. This
          # reads `git ls-files` and fails on any tracked file over 12 MiB, with no
          # exception list; docs/adr/0007-large-binaries-and-repository-size.md is the rule.
          python3 tools/repo_size.py --check
          # The numbers go into every job log, so a week of growth can be explained from
          # the logs instead of guessed at: largest tracked files, largest blobs in history,
          # and the commit that added each one.
          python3 tools/repo_size.py --report

      - name: Check the music loop is reproducible
        shell: bash
        run: |
          # The background music ships as a derived file: the owner's recording lives under
          # `art/` and `tools/build_music_loop.py` trims and crossfades it into the loop the
          # game imports. If the two drift, the shipped loop is a file nobody can rebuild and
          # nobody can hear the provenance of. The check also re-reads the recording's sha256,
          # so replacing the source without re-deriving it fails here.
          python3 tools/build_music_loop.py --check

      - name: Check the CI verdict itself
        shell: bash
        run: |
          # `tools/ci_run_check.sh` decides whether a headless check passed. It is the one
          # piece of CI whose mistake is invisible - a broken verdict reads as a green run -
          # so its behaviour is pinned here with fake commands and fake logs: pass, non-zero
          # exit, unhandled script error, parse error, verdict-less run, and the two named
          # exceptions (the import pass and the compile-only script check).
          bash tests/run_check_test.sh

      - name: Check the build check itself
        shell: bash
        run: |
          # `tools/verify_build.py` is the last thing standing between a release and a pack
          # full of screenshots. Its category budgets, its limits and its pack reader are
          # tested here, with packs this test writes, so the release job can be trusted to
          # report what it reports.
          python3 tests/verify_build_test.py

      - name: Check the repository size check itself
        shell: bash
        run: |
          # The size check runs in a shallow checkout, where half of what it reports on is
          # invisible, so it is tested against repositories the test builds: either side of
          # the ceiling, an untracked large file (which must NOT fail), an ignored one, and
          # a blob a later commit deleted (which the history report must still find).
          python3 tests/repo_size_test.py

      - name: Check the model library check itself
        shell: bash
        run: |
          # `tools/model_library.py` is the only reader any `.glb` gets before the pack, so
          # it is tested with files this test writes: a scaled node, a matrix node, a
          # camera, a light, one byte either side of the size and texture limits, a missing
          # sidecar, a sidecar left behind by a move, and a duplicated model name.
          python3 tests/model_library_test.py

      - name: Check the bundled font covers the current text
        shell: bash
        run: |
          # The font that ships is a 325 KiB subset of the 10 MB upstream one, rebuilt by
          # tools/subset_font.py from every character the project can put on screen. Text
          # that needs a character the subset does not carry would render as a tofu box in
          # a *build*, where no test would ever see it. This step fails on exactly that,
          # naming the characters, and tells you the command that fixes it.
          #
          # It also fails when a font bigger than 2 MiB sits under assets/, which is what
          # the unsplit source font would look like if it were ever moved back.
          set -uo pipefail
          /tmp/lint/bin/pip install --quiet "fonttools==4.58.5"
          /tmp/lint/bin/python tools/subset_font.py --check

      # Each command runs under `timeout` so a stalled test fails visibly instead of
      # consuming the job budget. Results are echoed to stdout and to the check
      # run's annotations, which makes failures readable from the API as well as
      # from the web log view.
      - name: Import and run headless checks
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p ci-logs

          # The verdict for a single check lives in `tools/ci_run_check.sh`, so it can be
          # tested without an engine (`tests/run_check_test.sh`, run a few steps up). It
          # fails a check whose log carries a Parse Error or an unhandled SCRIPT ERROR even
          # when the process exited 0: a runtime error inside a coroutine can leave the
          # harness's `PASS:` line in the log and still let the engine exit cleanly, which
          # is how a red test used to be reported green.
          source tools/ci_run_check.sh

          # The import has to be *blocking*. `--editor --quit` returns after one frame,
          # while the first filesystem scan is still running on its worker thread, so
          # `.godot/imported/` stays empty. That was harmless while no `.import` sidecar
          # was tracked: an asset without a sidecar is loaded from the source file by its
          # own loader. With the sidecars committed it stops being harmless, because a
          # sidecar makes the engine resolve the path through `.godot/imported/...` and
          # never fall back to the source — so the font, the GLBs and the WAVs all
          # became "non-existent" for the tests further down. `--import` is the engine's
          # own "import, then quit" mode and it waits for the queue to drain.
          # Its exit code is not the verdict: the project theme is loaded at start-up,
          # before the font it points at has been imported, so a first-pass error there
          # is expected. The audit right after is the verdict.
          run_check import 420 godot --headless --path . --import || true

          # Every committed `.import` names the file Godot must produce for it. A sidecar
          # whose file is missing is exactly the state described above, and it is silent:
          # the import log looks fine and the failure only shows up later, in whatever
          # test happens to load that asset, pointing at the asset instead of the import.
          echo "=== import audit: every committed .import must have its imported file"
          missing=0
          while IFS= read -r sidecar; do
            while IFS= read -r dest; do
              if [ -z "${dest}" ]; then
                continue
              fi
              if [ ! -f "${dest#res://}" ]; then
                echo "MISSING ${dest} (declared by ${sidecar})"
                missing=1
              fi
            done < <(grep -o 'res://\.godot/imported/[^"]*' "${sidecar}" | sort -u)
          done < <(find . -name '*.import' -not -path './.godot/*' | sort)
          if [ "${missing}" -ne 0 ]; then
            echo "IMPORT_AUDIT=failure"
            echo "::error title=import audit::a committed .import sidecar has no imported file (see the MISSING lines)"
            status=1
          else
            echo "IMPORT_AUDIT=success"
          fi
          run_check smoke 180 godot --headless --path . --script res://tests/smoke_test.gd || status=1
          # One camera, one field of view, and a faded wall that comes back. The fader
          # half of this is the regression for the occluder bug in #58.
          run_check camera_rig 240 godot --headless --path . --script res://tests/camera_rig_test.gd || status=1
          run_check narrative_state 180 godot --headless --path . --script res://tests/narrative_state_test.gd || status=1
          # The save file: what it refuses, and that a refused file changes nothing. No
          # scene here, so it is the fast place to look when saving breaks.
          run_check save_validation 180 godot --headless --path . --script res://tests/save_validation_test.gd || status=1
          # A real run is saved, the scene is freed, and a second main.tscn has to come
          # back in the same room, on the same marker, with the same knowledge and dice.
          run_check save_roundtrip 300 godot --headless --path . --script res://tests/save_roundtrip_test.gd || status=1
          run_check content 180 godot --headless --path . --script res://tests/dialogue_content_test.gd || status=1
          run_check dialogue_runtime 180 godot --headless --path . --script res://tests/dialogue_runtime_test.gd || status=1
          # A conversation can finish inside the call that started it; the director must
          # not then wait for a signal that was already sent. This check hangs (and the
          # watchdog fails it) if that regresses, which is the point of it.
          run_check dialogue_sync_finish 180 godot --headless --path . --script res://tests/dialogue_sync_finish_test.gd || status=1
          run_check dialogue_validation 180 godot --headless --path . --script res://tests/dialogue_validation_test.gd || status=1
          run_check dialogue_parity 180 godot --headless --path . --script res://tests/dialogue_parity_test.gd || status=1
          run_check i18n 120 godot --headless --path . --script res://tests/i18n_test.gd || status=1
          run_check language_switch 480 godot --headless --path . --script res://tests/language_switch_test.gd || status=1
          run_check opening_flow 520 godot --headless --path . --script res://tests/opening_flow_test.gd || status=1
          # The prologue is a list of flag-gated steps, so it can be started from the
          # middle. This feeds it four snapshots and refuses a replay of a beat that is
          # already behind it.
          run_check opening_resume 300 godot --headless --path . --script res://tests/opening_resume_test.gd || status=1
          # Every room on disk is described by data/story/locations.json, every door
          # points at a described room, and every key exists in both languages.
          run_check location_catalog 180 godot --headless --path . --script res://tests/location_catalog_test.gd || status=1
          run_check check_resolver 120 godot --headless --path . --script res://tests/check_resolver_test.gd || status=1
          run_check inner_abilities 120 godot --headless --path . --script res://tests/inner_abilities_test.gd || status=1
          run_check dialogue_check 180 godot --headless --path . --script res://tests/dialogue_check_test.gd || status=1
          run_check multi_voice 180 godot --headless --path . --script res://tests/multi_voice_test.gd || status=1
          run_check content_integrity 180 godot --headless --path . --script res://tests/content_integrity_test.gd || status=1
          run_check model_import 300 godot --headless --path . --script res://tests/model_import_test.gd || status=1
          # The four production assets the two samples grew into: the Poly Haven desk and
          # stationery, and the two characters. Same measurement, and the three places they
          # deviate from the pipeline contract are pinned instead of relaxed.
          run_check imported_assets 300 godot --headless --path . --script res://tests/imported_assets_test.gd || status=1
          # The same four assets, *placed*: the six student desks and the stationery on the
          # player's own desk, the player's model, and both of Q's (the classroom one and
          # the companion the director spawns). It fails on a graybox left behind, a second
          # collider on a desk, a model that hovers, or a character that faces backwards.
          run_check imported_placement 300 godot --headless --path . --script res://tests/imported_placement_test.gd || status=1
          # Classroom visual acceptance: layout, collisions, material ownership, navigation, and real-camera visibility.
          run_check classroom_visual_slice 240 godot --headless --path . --script res://tests/classroom_visual_slice_test.gd || status=1
          run_check playground_art_slice 480 godot --headless --path . --script res://tests/playground_art_slice_test.gd || status=1
          # This lab is isolated from the shipping scene; still compile and assert its actual resources in CI.
          run_check painterly_rendering 240 godot --headless --path . --script res://tests/painterly_rendering_test.gd || status=1
          run_check prop_asset 180 godot --headless --path . --script res://tests/prop_asset_test.gd || status=1
          run_check prop_placement 300 godot --headless --path . --script res://tests/prop_placement_test.gd || status=1
          # The corridor's three library models (#90): wrapper, wall/parapet contact,
          # working face towards the walkway, anchors and routes with the colliders baked in.
          run_check corridor_props 300 godot --headless --path . --script res://tests/corridor_props_test.gd || status=1
          # The four clips in `CharacterAnimation`, on both rigged characters: every track
          # has to point at a bone that exists on that rig, every clip has to actually move
          # the bone it is about, and the loop has to come back to where it started. The two
          # rigs name their bones differently, which is the thing being checked.
          run_check character_animation 240 godot --headless --path . --script res://tests/character_animation_test.gd || status=1
          # The same clips in the shipping game: main.tscn's player (keys and clicks), the
          # classroom Q and the following Q, measured off their skeletons.
          run_check runtime_character_animation 300 godot --headless --path . --script res://tests/runtime_character_animation_test.gd || status=1
          # The animation library retargeted onto the protagonist: the bones pair up, the
          # baked clip actually moves the character, and the retarget is rest-relative (the
          # source's rotation change and the target's are the same rotation). Then the
          # committed library the dev scene loads is checked the same way.
          run_check ual_retarget 420 godot --headless --path . --script res://tests/ual_retarget_test.gd || status=1
          run_check playground_flow 420 godot --headless --path . --script res://tests/playground_flow_test.gd || status=1
          run_check free_period 180 godot --headless --path . --script res://tests/free_period_test.gd || status=1
          run_check subjective_isolation 180 godot --headless --path . --script res://tests/subjective_isolation_test.gd || status=1
          run_check companion_route 300 godot --headless --path . --script res://tests/companion_route_test.gd || status=1
          run_check companion_obstacle 300 godot --headless --path . --script res://tests/companion_obstacle_test.gd || status=1
          run_check interaction_hover 240 godot --headless --path . --script res://tests/interaction_hover_test.gd || status=1
          # The kerb: what the bake does to the step numbers it is given, whether the
          # street's pavement is a walkable surface or an island, and whether the body
          # still steps only what it says it steps.
          run_check step_up 420 godot --headless --path . --script res://tests/step_up_test.gd || status=1
          run_check navigation 420 godot --headless --path . --script res://tests/navigation_test.gd || status=1
          run_check location_transition 420 godot --headless --path . --script res://tests/location_transition_test.gd || status=1
          # Ten rounds of switching between all six locations, measuring the navigation
          # map after every single switch: the frames it took to synchronize, the map's
          # iteration id either side, the regions on the map, and the offset of the spawn
          # and of every exit from the room's own mesh. The flakes this file exists for
          # were all about *when* a query is asked.
          run_check navigation_sync_stress 600 godot --headless --path . --script res://tests/navigation_sync_stress_test.gd || status=1
          run_check automatic_interaction 420 godot --headless --path . --script res://tests/automatic_interaction_test.gd || status=1
          run_check dialogue_pointer 300 godot --headless --resolution 1600x900 --path . --script res://tests/dialogue_pointer_test.gd || status=1
          run_check dialogue_layout 240 godot --headless --resolution 1600x900 --path . --script res://tests/dialogue_layout_test.gd || status=1
          # This exercises the portrait interface contract with flat textures generated by
          # the test itself; it deliberately adds no placeholder or production character art.
          run_check dialogue_portrait_contract 480 godot --headless --resolution 1600x900 --path . --script res://tests/dialogue_portrait_contract_test.gd || status=1
          run_check nameplate 180 godot --headless --path . --script res://tests/nameplate_test.gd || status=1
          run_check street_prompt 180 godot --headless --path . --script res://tests/street_prompt_test.gd || status=1
          run_check pointer_target_switch 300 godot --headless --resolution 1600x900 --path . --script res://tests/pointer_target_switch_test.gd || status=1
          run_check interaction_occlusion 300 godot --headless --resolution 1600x900 --path . --script res://tests/interaction_occlusion_test.gd || status=1
          run_check interaction_visibility_sweep 300 godot --headless --path . --script res://tests/interaction_visibility_sweep_test.gd || status=1
          # Compiles the window capture script. No test loads it — only the capture
          # workflow does — so until now a parse error in it reached CI only as a capture
          # run that quietly produced nothing and read a stale log instead. `--check-only`
          # fails on the same errors the real run would, in a few seconds and without a
          # display.
          run_check capture_script 120 godot --headless --path . --check-only --script res://tests/capture_playthrough.gd || status=1
          # The two cues the mouse draws: the ground mark (a small ring that lands, echoes
          # once and holds; a refusal that contracts) and the outline traced around the
          # object itself, its hand-over, its fallback, and the pick boxes under it.
          run_check interaction_cue 180 godot --headless --path . --script res://tests/interaction_cue_test.gd || status=1
          # The outline on shipped content: every interactable in the six locations and
          # the companion resolves meshes to trace and is pointable where they are drawn,
          # the overlay sits under the UI, and nothing authored uses its mask layer.
          run_check interaction_outline_content 240 godot --headless --path . --script res://tests/interaction_outline_content_test.gd || status=1
          # The same cues, in the ears: the four synthesised buffers, their levels, the
          # hover rate limit, and that the drawing code asks for the sound that matches.
          run_check interaction_audio 180 godot --headless --path . --script res://tests/interaction_audio_test.gd || status=1
          # The background music: the WAV has to be imported *as a loop* (loop points in the
          # sidecar, not a runtime flag), one player has to own it, a scene change must not
          # restart it, and the music dial must not move a cue.
          run_check music 240 godot --headless --path . --script res://tests/music_test.gd || status=1
          # The window the game opens in, and the one F11 has to come back to.
          run_check display_mode 180 godot --headless --path . --script res://tests/display_mode_test.gd || status=1
          # The HUD at the three sizes the game is expected to run in. The dialogue panel is
          # already measured at all three inside dialogue_layout; this is the other half.
          run_check hud_layout_720 180 godot --headless --resolution 1280x720 --path . --script res://tests/hud_layout_test.gd || status=1
          run_check hud_layout_900 180 godot --headless --resolution 1600x900 --path . --script res://tests/hud_layout_test.gd || status=1
          run_check hud_layout_1080 180 godot --headless --resolution 1920x1080 --path . --script res://tests/hud_layout_test.gd || status=1
          # The editor tool's data layer, driven headlessly against a user:// copy of the
          # real chapters: load, locate, edit, save, fail to save, and prove the files come
          # back byte-identical when nothing changed.
          run_check narrative_editor 300 godot --headless --path . --script res://tests/narrative_editor_test.gd || status=1
          # The strict field types and the per-field translation exception in the inner
          # voice registry.
          run_check ability_validation 180 godot --headless --path . --script res://tests/ability_validation_test.gd || status=1

          run_check_summary

      - name: Report the engine noise the checks left behind
        if: always()
        shell: bash
        run: |
          # What the verdict rule above does not cover: the engine's own `ERROR:` and
          # `WARNING:` lines. They no longer decide a check - an unhandled `SCRIPT ERROR`
          # does, and it fails the check - but "is the run clean?" is a question the next
          # person will ask about this branch, and the answer should not need a log
          # download. One notice per check that produced any, plus a total, so the number
          # is in the run's annotations rather than in a file nobody reads.
          #
          # An `ERROR:` line is not automatically a bug: a test that checks how the game
          # refuses something makes the engine print one on purpose. The line is reported,
          # with the check it came from, and the judgement is left to a reader.
          total=0
          for log in $(ls ci-logs/*.log 2>/dev/null | sort); do
            name=$(basename "${log}" .log)
            errors=$(grep -c "ERROR:" "${log}" || true)
            warnings=$(grep -c "WARNING:" "${log}" || true)
            scripts=$(grep -c "SCRIPT ERROR" "${log}" || true)
            if [ "${errors:-0}" -gt 0 ] || [ "${warnings:-0}" -gt 0 ]; then
              first=$(grep -m1 -E "ERROR:|WARNING:" "${log}" | cut -c1-240)
              echo "::notice title=engine noise (${name})::${errors:-0} ERROR, ${warnings:-0} WARNING, ${scripts:-0} SCRIPT ERROR - first: ${first}"
              total=$((total + ${errors:-0} + ${warnings:-0}))
            fi
          done
          echo "::notice title=engine noise::${total} ERROR/WARNING line(s) across the run"

      - name: Measure the text corpus, the locations and the bake
        shell: bash
        run: |
          # These two tests exist to report numbers as much as to assert them, and a runner
          # keeps only the first handful of annotations from a step. They therefore get their
          # own step, and their output is echoed instead of redirected: the notices they print
          # are the numbers this round is judged by, and they have to be readable from the run.
          #
          # The verdict is the test's own, not the process exit code. A windowed engine under
          # Xvfb exits non-zero while tearing down its GL context after a finished run (the
          # capture job learned this the hard way), and a headless engine can do the same after
          # `quit()`. So: a run passes when it printed its `PASS:` line and no `TEST FAILURE`,
          # `SCRIPT ERROR` or `Parse Error`. A run that died quietly printed neither and fails.
          set -uo pipefail
          status=0
          codes=""
          measured () {
            local name="$1"; shift
            echo "=== ${name}"
            timeout 420 "$@" > "ci-logs/${name}.log" 2>&1
            local code=$?
            cat "ci-logs/${name}.log"
            codes="${codes}${name}=${code} "
            echo "--- exit ${code}"
            # The verdict lines are the only thing the run report can carry, so they are
            # re-emitted as an annotation: without this, a failing measurement is a step that
            # says "exit code 1" and nothing else.
            local why
            why=$(grep -E "TEST FAILURE|TEST WATCHDOG|SCRIPT ERROR|Parse Error" \
              "ci-logs/${name}.log" | head -n 12 | tr '\n' '|' | cut -c1-3500)
            if [ -n "${why}" ]; then
              echo "::error title=${name} failed::${why}"
              return 1
            fi
            if ! grep -qE "^PASS: " "ci-logs/${name}.log"; then
              echo "::error title=${name} failed::the run printed no verdict at all (exit ${code})"
              return 1
            fi
            return 0
          }
          # What the text corpus costs, and what it contains: every chapter, every language.
          measured content_load_report godot --headless --path . --script res://tests/content_load_report_test.gd || status=1
          # The pressure test: all six locations, three round trips, one room in the tree.
          measured location_pressure godot --headless --path . --script res://tests/location_pressure_test.gd || status=1
          echo "measured: ${codes}"
          echo "::notice title=measurement step::exit codes ${codes}; status ${status}"
          exit "${status}"

      - name: Check the interaction outline against scene depth (rendered, Compatibility)
        if: always()
        shell: bash
        run: |
          # The one check here that looks at real pixels. Headless Godot draws nothing, so
          # this runs in a window under Xvfb on the Compatibility renderer (opengl3, Mesa's
          # software rasteriser on the runner) and reads its frames back: an unobstructed
          # object is outlined all round, one behind a wall draws nothing, one half behind a
          # post is outlined only where it shows, and switching, releasing and a moving camera
          # leave nothing behind. See tests/interaction_outline_occlusion_test.gd.
          #
          # The verdict is the test's own, as in the measurement step: a windowed engine can
          # exit non-zero while tearing down GL after a finished run, so the run passes when it
          # printed `PASS:` and no failure line. The frames it saved are uploaded as evidence.
          set -uo pipefail
          mkdir -p ci-logs
          evidence="${RUNNER_TEMP}/outline-occlusion"
          mkdir -p "${evidence}"
          log="ci-logs/interaction_outline_occlusion.log"
          OUTLINE_EVIDENCE_DIR="${evidence}" OUTLINE_REQUIRE_RENDERER=gl_compatibility \
            timeout 300 xvfb-run -a --server-args="-screen 0 1600x900x24" \
            godot --path . --resolution 1600x900 --rendering-method gl_compatibility \
            --rendering-driver opengl3 \
            --script res://tests/interaction_outline_occlusion_test.gd > "${log}" 2>&1
          code=$?
          cat "${log}"
          cp "${log}" "${evidence}/" || true
          echo "--- exit ${code}"
          # Annotation text has `%` escaped: the runner treats `%xx` as an escape and drops a
          # command it cannot decode, and the test's messages are full of percentages.
          escape () { local text="$1"; text="${text//\%/%25}"; printf '%s' "${text}"; }
          measures=$(grep -E '^(renderer|frame|NOTE|PASS):' "${log}" | tr '\n' '|' | cut -c1-1500)
          echo "::notice title=interaction_outline_occlusion (exit ${code})::$(escape "${measures:-no measurements}")"
          why=$(grep -E "TEST FAILURE|TEST WATCHDOG|SCRIPT ERROR|Parse Error" "${log}" \
            | head -n 12 | tr '\n' '|' | cut -c1-3500)
          if [ -n "${why}" ]; then
            echo "::error title=interaction_outline_occlusion failed::$(escape "${why}")"
            exit 1
          fi
          if ! grep -qE "^PASS: " "${log}"; then
            tail_lines=$(tail -n 8 "${log}" | tr '\n' '|' | cut -c1-1500)
            echo "::error title=interaction_outline_occlusion failed::no verdict (exit ${code}) - tail: $(escape "${tail_lines}")"
            exit 1
          fi

      - name: Upload the outline occlusion frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: outline-occlusion-evidence
          path: ${{ runner.temp }}/outline-occlusion
          if-no-files-found: warn
          retention-days: 14

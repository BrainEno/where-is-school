name: Classroom visual evidence

# Issue #150. The classroom wall pixel regression and the classroom capture, run for real
# (Xvfb, no --headless) on both of Godot's desktop renderers, each with its own verdict:
#
#   render (forward_plus)      Forward+ on Vulkan, Mesa lavapipe
#   render (gl_compatibility)  Compatibility on OpenGL 3, Mesa llvmpipe
#   negative-tests             the gate's own self-tests: wrong renderer, missing PASS,
#                              script error, black frame, missing image, pixel error over
#                              the limit, timeout, one renderer failing
#   verdict                    green only if both renderers and the self-tests passed
#
# Each render job also runs tests/capture_classroom_clock.gd (#173): three frames of the
# classroom clock - square on, and through the game camera from beside the front desks and from
# the aisle - from which the time is read back off the pixels. Every frame has to read nine
# o'clock, the hour Q names for biology, and the verifier re-reads that from the capture's
# own records.
#
# Dispatched with relay_clock_evidence=true, two more jobs carry those three frames into
# the run's annotations so they can be committed to docs/screenshots without the artifact
# store (see the relay section at the end).
#
# Each render job is judged twice: tests/run_classroom_checks.sh (strict run_check: exit
# code, PASS line, no script error, time limit) and tools/classroom_render_evidence.py
# (re-reads RESULT.txt, CAPTURE.txt and the raw PNGs: renderer, driver, engine, adapter,
# re-measured wall pixels against the unchanged thresholds, non-blank frames, PR head SHA).
# Godot's own Vulkan-to-OpenGL fallback cannot pass as Forward+: both scripts are told
# which renderer they must be on and the verifier checks what they recorded.
#
# This is Linux software rendering. A pass here is not Windows / RTX hardware or
# performance acceptance (#54); it does not decide whether the painterly shader belongs
# in production scenes.

on:
  pull_request:
    paths:
      - 'art/classroom/**'
      - 'assets/materials/classroom/**'
      - 'assets/shaders/**'
      - 'scenes/environment/props/classroom_art/**'
      - 'scenes/locations/classroom/**'
      - 'scripts/world/camera_occluder_fader.gd'
      - 'tests/capture_classroom_art.gd'
      - 'tests/capture_classroom_clock.gd'
      - 'tests/clock_reading.gd'
      - 'tests/clock_reading_test.gd'
      - 'tests/classroom_wall_render_test.gd'
      - 'tests/classroom_visual_slice_test.gd'
      - 'tests/classroom_wall_contract.gd'
      - 'tests/classroom_render_evidence_test.py'
      - 'tests/opening_flow_test.gd'
      - 'tests/run_check_test.sh'
      - 'tests/run_classroom_checks.sh'
      - 'tests/run_classroom_checks_test.sh'
      - 'tests/test_harness.gd'
      - 'tools/ci_run_check.sh'
      - 'tools/classroom_render_evidence.py'
      - '.github/workflows/classroom-art-evidence.yml'
  workflow_dispatch:
    inputs:
      relay_clock_evidence:
        description: "Also photograph the classroom clock on Forward+ and publish the frames as annotations (#173)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  render:
    name: Render the classroom (${{ matrix.method }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # Every renderer reports its own verdict, even when the other one fails.
      fail-fast: false
      matrix:
        include:
          - method: forward_plus
            driver: vulkan
          - method: gl_compatibility
            driver: opengl3
    env:
      EVIDENCE_DIR: build/classroom-evidence/checks
      # The evidence is tied to the commit the PR actually proposes, not GitHub's
      # temporary merge commit.
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
    steps:
      - name: Checkout the PR head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ env.HEAD_SHA }}

      - name: Install Xvfb and Mesa (lavapipe Vulkan, llvmpipe OpenGL)
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            xvfb xauth mesa-vulkan-drivers libgl1-mesa-dri libvulkan1 vulkan-tools mesa-utils

      - name: Install Godot 4.7.2 Stable
        uses: chickensoft-games/setup-godot@ac93246ea68518a384c1c280a496e5989341f2f6 # v2.4.3
        with:
          version: 4.7.2
          use-dotnet: false

      - name: Import project resources
        run: godot --headless --path . --import

      - name: Record the graphics stack
        # Diagnostics only: what the display offers to this renderer. The verdict comes
        # from the scripts and the verifier, which fail on a missing or wrong device.
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p "${EVIDENCE_DIR}"
          out="${EVIDENCE_DIR}/GRAPHICS_STACK_${{ matrix.method }}.txt"
          {
            echo "runner=$(uname -srm)"
            echo "--- vulkaninfo --summary"
            xvfb-run -a --server-args='-screen 0 1920x1080x24' vulkaninfo --summary 2>&1
            echo "exit=$?"
            echo "--- glxinfo -B (LIBGL_ALWAYS_SOFTWARE=1)"
            xvfb-run -a --server-args='-screen 0 1920x1080x24' \
              env LIBGL_ALWAYS_SOFTWARE=1 glxinfo -B 2>&1
            echo "exit=$?"
          } > "${out}"
          cat "${out}"

      - name: Run the pixel regression and capture on ${{ matrix.method }}
        shell: bash
        run: |
          set -uo pipefail
          extra=()
          if [ "${{ matrix.method }}" = gl_compatibility ]; then
            extra=(LIBGL_ALWAYS_SOFTWARE=1)
          fi
          xvfb-run -a --server-args='-screen 0 1920x1080x24' \
            env "${extra[@]}" \
              CLASSROOM_RENDER_METHODS="${{ matrix.method }}" \
              GODOT_GL_DRIVER=opengl3 \
              CLASSROOM_LOG_DIR="${EVIDENCE_DIR}" \
              bash tests/run_classroom_checks.sh --render-only

      - name: Verify the ${{ matrix.method }} evidence
        # Runs after a failed render too, so the artifact always carries a VERDICT.txt
        # that says why. It never turns a failed render green: the step above has
        # already failed the job.
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          python3 tools/classroom_render_evidence.py verify \
            --dir "${EVIDENCE_DIR}" \
            --method "${{ matrix.method }}" \
            --driver "${{ matrix.driver }}" \
            --head-sha "${HEAD_SHA}" \
            --base-sha "${BASE_SHA}"
          code=$?
          cat "${EVIDENCE_DIR}/VERDICT.txt" >> "${GITHUB_STEP_SUMMARY}" || true
          exit "${code}"

      - name: Publish ${{ matrix.method }} evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: classroom-render-${{ matrix.method }}-${{ env.HEAD_SHA }}
          path: ${{ env.EVIDENCE_DIR }}/
          if-no-files-found: error
          retention-days: 30

  negative-tests:
    name: Prove the render gate fails on bad evidence
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Evidence verifier rejects every bad case
        run: python3 tests/classroom_render_evidence_test.py

      - name: run_check rejects failures, missing verdicts and timeouts
        run: bash tests/run_check_test.sh

      - name: One wrong renderer turns the whole gate red
        run: bash tests/run_classroom_checks_test.sh

  verdict:
    name: Classroom render verdict (both renderers)
    if: always()
    needs: [render, negative-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Download the per-renderer verdicts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: classroom-render-*
          path: build/classroom-verdicts

      - name: Require a PASS from both renderers and the self-tests
        shell: bash
        env:
          RENDER_RESULT: ${{ needs.render.result }}
          NEGATIVE_RESULT: ${{ needs.negative-tests.result }}
        run: |
          set -uo pipefail
          status=0
          mapfile -t verdicts < <(find build/classroom-verdicts -name VERDICT.txt | sort)
          python3 tools/classroom_render_evidence.py summarize \
            --require forward_plus,gl_compatibility "${verdicts[@]}" || status=1
          if [ "${RENDER_RESULT}" != success ]; then
            echo "::error title=classroom render verdict::render jobs ended '${RENDER_RESULT}'"
            status=1
          fi
          if [ "${NEGATIVE_RESULT}" != success ]; then
            echo "::error title=classroom render verdict::gate self-tests ended '${NEGATIVE_RESULT}'"
            status=1
          fi
          exit "${status}"

  # --- Clock evidence relay (#173) ---------------------------------------------------
  # Dispatch-only: `gh workflow run classroom-art-evidence.yml --ref <branch> -f
  # relay_clock_evidence=true`. The same clock capture as the render job, on Forward+
  # (the project's renderer), asked for a full-size JPEG beside each PNG. The capture
  # refuses to pass unless every frame reads nine o'clock off its own pixels, and prints an
  # EVIDENCE record for each; `tools/dialogue_evidence_relay.py pack --set clock` checks
  # every frame has a record and a JPEG of the recorded size and splits them into parts,
  # which `relay-publish` prints as `relay <file> <i>/<n>` notices (45 per job).
  # `python3 tools/dialogue_evidence_relay.py fetch --run <id> --apply` rebuilds the files,
  # checks each against the SHA-256 the capture recorded, and records them as current in
  # docs/screenshots/MANIFEST.json, where tools/screenshot_evidence.py keeps them tied to the
  # time the scene's hands show. Nothing is committed by Actions (#88).
  relay-capture:
    name: Relay - photograph the classroom clock
    if: github.event_name == 'workflow_dispatch' && inputs.relay_clock_evidence
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      shards: ${{ steps.pack.outputs.shards }}
      parts: ${{ steps.pack.outputs.parts }}
    env:
      RELAY_COMMIT: ${{ github.sha }}
      CLOCK_DIR: build/clock-relay
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ env.RELAY_COMMIT }}

      - name: Install Xvfb and Mesa (lavapipe Vulkan)
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            xvfb xauth mesa-vulkan-drivers libgl1-mesa-dri libvulkan1

      - uses: chickensoft-games/setup-godot@ac93246ea68518a384c1c280a496e5989341f2f6 # v2.4.3
        with:
          version: 4.7.2
          use-dotnet: false

      - name: Import project resources
        run: godot --headless --path . --import

      - name: Photograph the clock and read it
        shell: bash
        env:
          WIS_EVIDENCE_JPEG_QUALITY: "0.9"
        run: |
          set +e -uo pipefail
          xvfb-run -a --server-args='-screen 0 1920x1080x24' \
            godot --path . --audio-driver Dummy --resolution 1600x900 \
              --rendering-method forward_plus --rendering-driver vulkan \
              --script res://tests/capture_classroom_clock.gd \
              -- "--output=${CLOCK_DIR}" --expect-renderer=forward_plus --expect-driver=vulkan \
              > "${RUNNER_TEMP}/clock.log" 2>&1
          code=$?
          grep -E "^CLOCK_CAPTURE |^EVIDENCE |TEST FAILURE|SCRIPT ERROR|^PASS:|^FAIL:" "${RUNNER_TEMP}/clock.log" | head -n 60
          grep -E "^CLOCK_CAPTURE .*reads " "${RUNNER_TEMP}/clock.log" | cut -c1-900 \
            | while IFS= read -r line; do echo "::notice title=clock reading::${line#CLOCK_CAPTURE }"; done
          grep -E "TEST FAILURE|SCRIPT ERROR" "${RUNNER_TEMP}/clock.log" | head -n 8 | cut -c1-600 \
            | while IFS= read -r line; do echo "::error title=clock capture::${line}"; done
          if [ "${code}" -ne 0 ] || ! grep -q "^PASS:" "${RUNNER_TEMP}/clock.log"; then
            echo "::error title=clock capture::exit ${code}; the clock did not read nine o'clock from every view"
            exit 1
          fi

      - name: Pack the frames into annotation parts
        id: pack
        shell: bash
        run: |
          set -uo pipefail
          python3 tools/dialogue_evidence_relay.py pack --set clock \
            --log "${RUNNER_TEMP}/clock.log" --frames "${CLOCK_DIR}" --out "${RUNNER_TEMP}/relay"
          ls -l "${RUNNER_TEMP}/relay"

      - name: Upload the frames
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: clock-evidence-relay-${{ github.run_attempt }}
          path: |
            ${{ env.CLOCK_DIR }}/
            ${{ runner.temp }}/relay/
            ${{ runner.temp }}/clock.log
          if-no-files-found: warn

  relay-publish:
    name: Relay - publish parts (shard ${{ matrix.shard }})
    needs: relay-capture
    if: needs.relay-capture.result == 'success' && needs.relay-capture.outputs.shards != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.relay-capture.outputs.shards) }}
    env:
      PER_JOB: 45
      SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: clock-evidence-relay-${{ github.run_attempt }}
          path: ${{ runner.temp }}/evidence

      - name: Select this shard
        shell: bash
        run: |
          set -euo pipefail
          queue=$(find "${RUNNER_TEMP}/evidence" -name queue.txt | head -n 1)
          first=$(( SHARD * PER_JOB + 1 ))
          last=$(( first + PER_JOB - 1 ))
          sed -n "${first},${last}p" "${queue}" > "${RUNNER_TEMP}/shard.txt"
          echo "shard ${SHARD}: lines ${first}-${last} of $(wc -l < "${queue}"), $(wc -l < "${RUNNER_TEMP}/shard.txt") here"

      # Ten notices per step, five steps: 45 parts and room for nothing else to be dropped.
      - name: Publish 1/5
        shell: bash
        run: sed -n '1,9p' "${RUNNER_TEMP}/shard.txt" | while read -r file part data; do echo "::notice title=relay ${file} ${part}::${data}"; done
      - name: Publish 2/5
        shell: bash
        run: sed -n '10,18p' "${RUNNER_TEMP}/shard.txt" | while read -r file part data; do echo "::notice title=relay ${file} ${part}::${data}"; done
      - name: Publish 3/5
        shell: bash
        run: sed -n '19,27p' "${RUNNER_TEMP}/shard.txt" | while read -r file part data; do echo "::notice title=relay ${file} ${part}::${data}"; done
      - name: Publish 4/5
        shell: bash
        run: sed -n '28,36p' "${RUNNER_TEMP}/shard.txt" | while read -r file part data; do echo "::notice title=relay ${file} ${part}::${data}"; done
      - name: Publish 5/5
        shell: bash
        run: sed -n '37,45p' "${RUNNER_TEMP}/shard.txt" | while read -r file part data; do echo "::notice title=relay ${file} ${part}::${data}"; done

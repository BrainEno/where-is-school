name: Laboratory capture

# Evidence for the laboratory (#163): the frames the acceptance asks for, rendered by the
# game itself, plus a recorded walkthrough. `tests/capture_laboratory.gd` takes the frames
# and `tests/capture_laboratory_walkthrough.gd` records the route; see their headers.
#
# Seven two-frame jobs (six Compatibility, one Forward+) keep the inline images
# within GitHub's annotation budget.
# The annotations let a reviewer read the frames through the REST API even where the artifact
# store cannot be reached; each job also uploads the same frames at full size.
#
# The stills share one matrix: the full set uses the shipping Compatibility renderer,
# and a comparison pair uses Forward+ through lavapipe. Both keep their own artifacts.

on:
  pull_request:
    paths:
      - "scenes/locations/laboratory/**"
      - "assets/materials/laboratory/**"
      - "assets/audio/laboratory_hum.wav"
      - "data/inspections/*/laboratory.json"
      - "scripts/laboratory/**"
      - "tools/build_laboratory.py"
      - "art/laboratory/**"
      - "tests/capture_laboratory.gd"
      - "tests/capture_laboratory_walkthrough.gd"
      - "tools/ci_import_godot.sh"
      - ".github/workflows/laboratory-capture.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frames:
    name: ${{ matrix.check_name || format('frames ({0})', matrix.group) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: room
            only: "room_wide,entrance_view"
          - group: bench_cable_origin
            only: "wet_bench,cable_origin"
          - group: detail_route
            only: "bench_detail,route_aisle"
          - group: cable_drum
            only: "cable_knot,drum_close"
          - group: door_corridor
            only: "annex_door,far_corridor"
          - group: annex_walk
            only: "annex_inside,explore_to_unknown"
          - group: forward-plus
            check_name: forward+ (vulkan)
            only: "room_wide,annex_inside"
            label: forward_plus
            driver: vulkan
            notice_prefix: fp_
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: ./.github/actions/setup-godot

      - name: Install a software Vulkan driver
        if: matrix.driver == 'vulkan'
        shell: bash
        run: |
          # The runner has no GPU. Forward+ uses lavapipe; Compatibility needs only OpenGL.
          sudo apt-get update -qq
          sudo apt-get install -y -qq mesa-vulkan-drivers vulkan-tools
          vulkaninfo --summary 2>&1 | head -n 20 || true

      - name: Import
        shell: bash
        run: bash tools/ci_import_godot.sh "${RUNNER_TEMP}"

      - name: Capture
        shell: bash
        env:
          GROUP: ${{ matrix.group }}
          ONLY: ${{ matrix.only }}
          LABEL: ${{ matrix.label || 'compatibility' }}
          DRIVER: ${{ matrix.driver || 'opengl3' }}
          NOTICE_PREFIX: ${{ matrix.notice_prefix || '' }}
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/capture.log"
          code=0
          xvfb-run -a --server-args="-screen 0 1600x900x24" \
            godot --path . --resolution 1600x900 --rendering-driver "${DRIVER}" --audio-driver Dummy \
            --script res://tests/capture_laboratory.gd -- \
            "label=${LABEL}" "only=${ONLY}" width=960 quality=0.86 \
            > "${log}" 2>&1 || code=$?
          grep -m 40 -E 'LABORATORY_CAPTURE|Vulkan|vulkan|PASS|FAIL|SCRIPT ERROR|ERROR:' "${log}" || true
          shopt -s nullglob
          shots=(docs/screenshots/laboratory/"${LABEL}"/*.jpg)
          echo "frames=${#shots[@]} exit=${code}"
          if [ "${code}" -ne 0 ] || [ "${#shots[@]}" -ne 2 ] || \
              grep -Eq 'SCRIPT ERROR|TEST FAILURE|^FAIL:|^ERROR:' "${log}" || \
              ! grep -q '^PASS:' "${log}"; then
            echo "::error title=laboratory capture::${GROUP} wrote ${#shots[@]} frame(s), exit ${code}"
            tail -n 25 "${log}" | cut -c1-400 || true
            exit 1
          fi
          # Staging or encoding a frame is part of success too. Keep errexit enabled.
          stage="${RUNNER_TEMP}/frames"
          mkdir -p "${stage}"
          cp -- "${shots[@]}" "${stage}/"
          queue="${RUNNER_TEMP}/queue.txt"
          : > "${queue}"
          for shot in "${shots[@]}"; do
            file="${shot##*/}"
            data=$(base64 -w0 "${stage}/${file}")
            parts=$(( (${#data} + 3999) / 4000 ))
            for ((i=0; i<parts; i++)); do
              printf '%s%s %s/%s %s\n' "${NOTICE_PREFIX}" "${file}" "$((i + 1))" "${parts}" \
                "${data:$((i * 4000)):4000}" >> "${queue}"
            done
          done
          echo "queued $(wc -l < "${queue}") annotation part(s)"

      # GitHub keeps at most 10 notices per step and 50 annotations per job: five steps of
      # ten. An incomplete frame is still in the artifact. Only publish after Capture
      # succeeds; the upload step still keeps any capture log on failure.
      - name: Publish frames 1/5
        shell: bash
        run: sed -n '1,10p' "${RUNNER_TEMP}/queue.txt" | while read -r file part data; do echo "::notice title=frame ${file} part ${part}::${data}"; done
      - name: Publish frames 2/5
        shell: bash
        run: sed -n '11,20p' "${RUNNER_TEMP}/queue.txt" | while read -r file part data; do echo "::notice title=frame ${file} part ${part}::${data}"; done
      - name: Publish frames 3/5
        shell: bash
        run: sed -n '21,30p' "${RUNNER_TEMP}/queue.txt" | while read -r file part data; do echo "::notice title=frame ${file} part ${part}::${data}"; done
      - name: Publish frames 4/5
        shell: bash
        run: sed -n '31,40p' "${RUNNER_TEMP}/queue.txt" | while read -r file part data; do echo "::notice title=frame ${file} part ${part}::${data}"; done
      - name: Publish frames 5/5
        shell: bash
        run: |
          sed -n '41,50p' "${RUNNER_TEMP}/queue.txt" | while read -r file part data; do echo "::notice title=frame ${file} part ${part}::${data}"; done
          total=$(wc -l < "${RUNNER_TEMP}/queue.txt")
          if [ "${total}" -gt 50 ]; then
            echo "${total} parts queued, 50 published; the rest are only in the artifact"
          fi

      - name: Upload frames
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: laboratory-frames-${{ matrix.group }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/frames/
            ${{ runner.temp }}/capture.log
          if-no-files-found: warn

  walkthrough:
    name: walkthrough (recording)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: ./.github/actions/setup-godot

      - name: Import
        shell: bash
        run: bash tools/ci_import_godot.sh "${RUNNER_TEMP}"

      - name: Transcoding tools
        shell: bash
        run: |
          # The ubuntu-latest image no longer carries ffmpeg: the step that used it failed with
          # `ffmpeg: command not found` and read as a transcoding error for two runs. Install it
          # here, and say so loudly if it is not there, so the recording step knows which of its
          # two jobs it is doing.
          if command -v ffmpeg > /dev/null 2>&1; then
            ffmpeg -version | head -n 1
            exit 0
          fi
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg > /dev/null
          if ! command -v ffmpeg > /dev/null 2>&1; then
            echo "::warning title=laboratory walkthrough::ffmpeg is not available; the recording will be uploaded as the movie maker wrote it"
          fi
          ffmpeg -version | head -n 1 || true

      - name: Record
        shell: bash
        run: |
          # Movie maker renders at a fixed step and writes every frame, so the recording is
          # the same on every run. The frames are written as a PNG sequence and handed to
          # ffmpeg afterwards: an .avi written by the movie maker is only readable once its
          # index is patched at exit, so a process that ends badly leaves a file ffmpeg
          # cannot open at all, and the run cannot say why. A sequence of individual PNGs
          # is either there or not.
          set +e -uo pipefail
          mkdir -p build/walkthrough
          ffmpeg -version | head -n 1
          xvfb-run -a --server-args="-screen 0 960x540x24" \
            godot --verbose --path . --resolution 960x540 --rendering-driver opengl3 --audio-driver Dummy \
            --write-movie build/walkthrough/frame.png --fixed-fps 24 \
            --script res://tests/capture_laboratory_walkthrough.gd \
            > "${RUNNER_TEMP}/record.log" 2>&1
          code=$?
          grep -E "LABORATORY_WALKTHROUGH|PASS|FAIL|SCRIPT ERROR|Movie" "${RUNNER_TEMP}/record.log" | head -n 30
          frames=$(find build/walkthrough -name '*.png' | wc -l)
          echo "recording: exit ${code}, ${frames} frames"
          if [ "${code}" -ne 0 ] || [ "${frames}" -lt 480 ] || \
              grep -Eq 'SCRIPT ERROR|TEST FAILURE|^FAIL:|^ERROR:' "${RUNNER_TEMP}/record.log" || \
              ! grep -q '^PASS:' "${RUNNER_TEMP}/record.log"; then
            echo "::error title=laboratory walkthrough::${frames} frames were written (exit ${code})"
            grep -E 'SCRIPT ERROR|TEST FAILURE|^FAIL:|^ERROR:|^PASS:|^Resource still in use:|LABORATORY_WALKTHROUGH' \
              "${RUNNER_TEMP}/record.log" | cut -c1-400 | sort -u | head -n 12 | while IFS= read -r msg; do
                printf '::notice title=laboratory walkthrough log::%s\n' "$msg"
              done
            tail -n 25 "${RUNNER_TEMP}/record.log" | cut -c1-400 || true
            exit 1
          fi
          echo "::notice title=laboratory walkthrough::recorded ${frames} frames at 24 fps (exit ${code})"
          # What the frames actually are, as an annotation: if the sequence is not what the
          # encoder expects, the notice says so without needing the artifact.
          first=$(find build/walkthrough -name '*.png' | sort | sed -n '1p')
          python3 - "$first" <<'PY'
          import struct, sys
          path = sys.argv[1]
          with open(path, 'rb') as handle:
              data = handle.read(33)
          signature = data[:8] == b"\x89PNG\r\n\x1a\n"
          width, height, depth, colour = struct.unpack(">IIBB", data[16:26])
          print("::notice title=laboratory walkthrough::first frame %d bytes, signature %s, "
                "%dx%d, depth %d, colour type %d" % (len(open(path, 'rb').read()), signature,
                                                     width, height, depth, colour))
          PY
          # Three encoders, in order, then a GIF: libx264 is not guaranteed even when ffmpeg
          # is present, and the encoder is a far likelier point of failure here than the
          # frames are. `gif` is the only encoder that is always compiled in, so it is the
          # floor this step stands on.
          encoded=""
          : > "${RUNNER_TEMP}/ffmpeg.log"
          for spec in "libx264:mp4:-preset slow -crf 24" "libvpx-vp9:webm:-b:v 0 -crf 34 -row-mt 1" "mpeg4:mp4:-q:v 4"; do
            codec=${spec%%:*}
            rest=${spec#*:}
            container=${rest%%:*}
            options=${rest#*:}
            out="build/laboratory_walkthrough.${container}"
            mux=()
            if [ "$container" = mp4 ]; then mux=(-movflags +faststart); fi
            echo "--- trying ${codec} -> ${out}" >> "${RUNNER_TEMP}/ffmpeg.log"
            # shellcheck disable=SC2086
            ffmpeg -y -framerate 24 -pattern_type glob -i 'build/walkthrough/*.png' \
              -c:v "${codec}" ${options} -pix_fmt yuv420p "${mux[@]}" \
              "${out}" >> "${RUNNER_TEMP}/ffmpeg.log" 2>&1
            if [ $? -eq 0 ] && [ -s "${out}" ]; then
              encoded="${out}"
              echo "::notice title=laboratory walkthrough::encoded with ${codec} ($(stat -c%s "${out}") bytes)"
              break
            fi
            rm -f "${out}"
          done
          if [ -z "${encoded}" ]; then
            ffmpeg -y -framerate 24 -pattern_type glob -i 'build/walkthrough/*.png' \
              -vf "scale=640:-2:flags=lanczos,split[a][b];[a]palettegen[p];[b][p]paletteuse" \
              build/laboratory_walkthrough.gif >> "${RUNNER_TEMP}/ffmpeg.log" 2>&1
            if [ -s build/laboratory_walkthrough.gif ]; then
              encoded="build/laboratory_walkthrough.gif"
              echo "::warning title=laboratory walkthrough::no video encoder accepted the frames; the recording is a GIF"
            fi
          fi
          # Whatever happened, the log says why: this line is the only way to read it without
          # downloading the artifact, which the run cannot do.
          echo "::notice title=laboratory walkthrough::$(grep -vE '^\s*$' "${RUNNER_TEMP}/ffmpeg.log" | tail -n 3 | tr '\n' '|' | cut -c1-450)"
          if [ -z "${encoded}" ] && ! command -v ffmpeg > /dev/null 2>&1; then
            # No ffmpeg on the runner and no encoder to fall back to: record what the movie
            # maker can write on its own and ship that. It plays in a video player, not in a
            # browser, which is worse than an mp4 and better than nothing.
            xvfb-run -a --server-args="-screen 0 960x540x24" \
              godot --path . --resolution 960x540 --rendering-driver opengl3 --audio-driver Dummy \
              --write-movie build/laboratory_walkthrough.avi --fixed-fps 24 \
              --script res://tests/capture_laboratory_walkthrough.gd \
              > "${RUNNER_TEMP}/record-avi.log" 2>&1
            if [ -s build/laboratory_walkthrough.avi ]; then
              echo "::warning title=laboratory walkthrough::uploaded as AVI; no encoder was available"
              encoded="build/laboratory_walkthrough.avi"
            fi
          fi
          if [ -z "${encoded}" ]; then
            echo "::error title=laboratory walkthrough::no encoder accepted the recording"
            exit 1
          fi
          # Two frames kept as stills: the route is also evidence, not only the video.
          cp "$(find build/walkthrough -name '*.png' | sort | sed -n '1p')" build/walkthrough_start.png
          cp "$(find build/walkthrough -name '*.png' | sort | tail -n 1)" build/walkthrough_end.png
          rm -rf build/walkthrough
          ffprobe -v error -show_entries format=duration,size -of default=nw=1 \
            "${encoded}" || true

      - name: Upload recording
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: laboratory-walkthrough-${{ github.run_attempt }}
          path: |
            build/laboratory_walkthrough.mp4
            build/laboratory_walkthrough.webm
            build/laboratory_walkthrough.gif
            build/laboratory_walkthrough.avi
            build/walkthrough_start.png
            build/walkthrough_end.png
            ${{ runner.temp }}/record.log
            ${{ runner.temp }}/ffmpeg.log
          if-no-files-found: warn

name: Temporary font refresh

on:
  push:
    branches: [writing/scene-dialogue-naturalization]
    paths:
      - ".github/workflows/temporary-font-refresh.yml"

permissions:
  contents: write
  actions: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Rebuild the committed font subsets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 -m venv /tmp/fonts
          /tmp/fonts/bin/pip install --quiet "fonttools==4.58.5"
          /tmp/fonts/bin/python tools/subset_font.py

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/fonts/NotoSansSC-Regular.ttf assets/fonts/NotoSerifSC-Regular.otf
          git rm .github/workflows/temporary-font-refresh.yml
          git commit -m "build(fonts): include glyphs used by revised dialogue"
          git push origin HEAD:writing/scene-dialogue-naturalization

          # A GITHUB_TOKEN push does not start the PR workflows. Dispatch the same
          # three checks explicitly against the updated PR head.
          gh workflow run godot-ci.yml --ref writing/scene-dialogue-naturalization
          gh workflow run playthrough-capture.yml --ref writing/scene-dialogue-naturalization
          gh workflow run release.yml --ref writing/scene-dialogue-naturalization

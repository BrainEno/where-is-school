name: Playthrough capture

# Runs the real game in a real window under Xvfb, drives it with simulated keys,
# and saves what the player would see.
#
# Two jobs on purpose:
# - `capture` runs on pull requests, main and on demand, with **read-only**
#   permissions. It is a verification job: it fails when the import fails or when
#   the playthrough does not reach its end marker.
# - `publish` only runs for a successful capture on `main`, and is the only place
#   that is allowed to write. A failed or partial run can therefore never replace
#   the screenshots that a good run produced.

on:
  push:
    branches: [main]
    paths:
      - "tests/capture_playthrough.gd"
      - ".github/workflows/playthrough-capture.yml"
      - "scenes/**"
      - "scripts/**"
      - "data/**"
  pull_request:
    branches: [main]
    paths:
      - "tests/capture_playthrough.gd"
      - ".github/workflows/playthrough-capture.yml"
      - "scenes/**"
      - "scripts/**"
      - "data/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    name: Drive the game under Xvfb and save the frames
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: chickensoft-games/setup-godot@v2.4.3
        with:
          version: 4.7.2
          use-dotnet: false

      - name: Static syntax check
        id: parse
        shell: bash
        run: |
          # The engine's import pass only compiles the scripts something actually
          # loads, so a broken file nothing references can sit in the tree and the
          # import still exits 0. gdtoolkit's parser reads every file, without
          # needing a display or an engine instance. It is a CI-only tool: nothing
          # from it ships with the game.
          set -uo pipefail
          python3 -m venv /tmp/lint >/dev/null 2>&1
          /tmp/lint/bin/pip install --quiet "gdtoolkit==4.5.0"
          mapfile -t files < <(find . -name '*.gd' -not -path './.godot/*' -not -path './addons/*' | sort)
          echo "checking ${#files[@]} GDScript file(s)"
          if ! /tmp/lint/bin/gdparse "${files[@]}"; then
            echo "PARSE_RESULT=failure"
            echo "::error title=GDScript syntax::gdparse rejected at least one file (see the step log)"
            exit 1
          fi
          echo "PARSE_RESULT=success"

      - name: Import project
        id: import
        shell: bash
        run: |
          set -uo pipefail
          # Two passes, on purpose. The first scans a fresh checkout, where an
          # asset that another resource points at may not have been imported yet
          # (the bundled CJK font is the usual one), so it may report a dependency
          # that the scan itself is about to create. The second pass starts from a
          # populated import cache: every remaining parse error is real, and this
          # is the pass whose result is trusted.
          run_import () {
            local log="$1"
            godot --headless --editor --path . --quit > "${log}" 2>&1
            return $?
          }

          run_import /tmp/import-1.log
          first=$?
          grep -E "SCRIPT ERROR|Parse Error|ERROR:" /tmp/import-1.log | head -n 20 || true
          if [ "${first}" -ne 0 ]; then
            summary=$(grep -E "SCRIPT ERROR|Parse Error|ERROR:" /tmp/import-1.log | head -n 10 | tr '\n' '|' | cut -c1-1500)
            echo "IMPORT_RESULT=failure"
            echo "::error title=import failed (exit ${first})::${summary:-no summary captured}"
            exit "${first}"
          fi

          run_import /tmp/import-2.log
          second=$?
          grep -E "SCRIPT ERROR|Parse Error|ERROR:" /tmp/import-2.log | head -n 20 || true
          if [ "${second}" -ne 0 ]; then
            summary=$(grep -E "SCRIPT ERROR|Parse Error|ERROR:" /tmp/import-2.log | head -n 10 | tr '\n' '|' | cut -c1-1500)
            echo "IMPORT_RESULT=failure"
            echo "::error title=import failed on the second pass (exit ${second})::${summary:-no summary captured}"
            exit "${second}"
          fi
          # A non-zero exit is not the only way an import breaks: a script that
          # fails to parse is reported in the log while the editor still quits.
          if grep -qE "SCRIPT ERROR|Parse Error" /tmp/import-2.log; then
            summary=$(grep -E "SCRIPT ERROR|Parse Error" /tmp/import-2.log | head -n 10 | tr '\n' '|' | cut -c1-1500)
            echo "IMPORT_RESULT=failure"
            echo "::error title=import reported script errors::${summary}"
            exit 1
          fi
          echo "IMPORT_RESULT=success"

      - name: Capture the playthrough
        id: capture
        shell: bash
        run: |
          # GitHub runs bash steps with -e; the capture is allowed to fail so the
          # frames it did save are kept. The step still fails: a run that did not
          # reach its end marker must not look green.
          set -uo pipefail
          mkdir -p docs/screenshots
          xvfb-run -a --server-args="-screen 0 1600x900x24" \
            godot --path . --resolution 1600x900 --rendering-driver opengl3 \
            --script res://tests/capture_playthrough.gd > /tmp/capture.log 2>&1
          code=$?
          echo "capture exit=${code}"
          grep -E "CAPTURE|SCRIPT ERROR|ERROR:" /tmp/capture.log | tail -n 60 || true
          ls -l docs/screenshots || true
          summary=$(grep -E "FAILURE|RESULT" docs/screenshots/PLAYTHROUGH.log 2>/dev/null | tr '\n' '|' | cut -c1-1500) || true
          if [ "${code}" -ne 0 ]; then
            echo "CAPTURE_RESULT=failure"
            echo "::error title=playthrough failed (exit ${code})::${summary:-no summary}"
            exit "${code}"
          fi
          # Exit code 0 alone is not enough: the script has to say it reached the
          # end of the slice, otherwise a run that stopped early would pass.
          if ! grep -qE "^\[[^]]*\] RESULT: " docs/screenshots/PLAYTHROUGH.log 2>/dev/null; then
            echo "CAPTURE_RESULT=failure"
            echo "::error title=playthrough ended without a result marker::${summary:-no log}"
            exit 1
          fi
          echo "CAPTURE_RESULT=success"
          echo "shot_count=$(find docs/screenshots -name '*.png' | wc -l)" >> "$GITHUB_OUTPUT"
          echo "::notice title=playthrough::${summary:-capture finished}"

      - name: Summarise the result
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          {
            echo "### Playthrough capture"
            echo ""
            echo "| check | result |"
            echo "| --- | --- |"
            echo "| syntax | ${PARSE_OUTCOME:-unknown} |"
            echo "| import | ${IMPORT_OUTCOME:-unknown} |"
            echo "| capture | ${CAPTURE_OUTCOME:-unknown} |"
            echo ""
            echo "Screenshots: ${SHOT_COUNT:-0} frame file(s) in docs/screenshots after the run."
            echo "Log: see the run log and the 'playthrough-log' artifact."
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          PARSE_OUTCOME: ${{ steps.parse.outcome }}
          IMPORT_OUTCOME: ${{ steps.import.outcome }}
          CAPTURE_OUTCOME: ${{ steps.capture.outcome }}
          SHOT_COUNT: ${{ steps.capture.outputs.shot_count }}

      - name: Upload the evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playthrough-evidence
          path: |
            /tmp/import-1.log
            /tmp/import-2.log
            /tmp/capture.log
            docs/screenshots
          if-no-files-found: warn

  publish:
    name: Commit the frames (main, successful runs only)
    needs: capture
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.capture.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}

      - name: Download the frames from the capture job
        uses: actions/download-artifact@v4
        with:
          name: playthrough-evidence
          path: /tmp/evidence

      - name: Commit the frames
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d /tmp/evidence/docs/screenshots ]; then
            echo "::error title=no screenshots in the artifact::the capture produced no frames to publish"
            exit 1
          fi
          rm -rf docs/screenshots
          mkdir -p docs/screenshots
          cp -a /tmp/evidence/docs/screenshots/. docs/screenshots/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          if git diff --cached --quiet; then
            echo "no screenshot changes"
            exit 0
          fi
          # [skip ci]: the frames are evidence of a run that already happened, not a
          # change that needs its own full CI pass.
          git commit -m "Playthrough capture: update screenshots from a successful run [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"

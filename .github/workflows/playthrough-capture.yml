name: Playthrough capture

# Read-only validation on PRs; logs/frames are run artifacts, never pushed back
# to the source branch or over previously reviewed successful screenshots.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    name: Drive the game under Xvfb and save the frames
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: chickensoft-games/setup-godot@v2.4.3
        with:
          version: 4.7.2
          use-dotnet: false
      - name: Import and capture
        shell: bash
        env:
          CAPTURE_OUTPUT_DIR: ${{ runner.temp }}/playthrough-evidence
        run: tools/run-playthrough-capture.sh
      - name: Upload evidence (including failed logs and partial frames)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playthrough-evidence
          path: ${{ runner.temp }}/playthrough-evidence/
          if-no-files-found: warn

name: Playthrough capture

# A real Godot window under Xvfb, driven by simulated input and some teleports.
# Evidence is an artifact, never a bot commit: a failed/incomplete run cannot
# overwrite previously reviewed screenshots, and pull requests need no write token.
on:
  push:
    paths:
      - "project.godot"
      - "assets/**"
      - "tests/capture_playthrough.gd"
      - "tests/test_capture_ci.py"
      - "scripts/ci/**"
      - ".github/workflows/playthrough-capture.yml"
      - "scenes/**"
      - "scripts/**"
      - "data/**"
  pull_request:
    branches: [main]
    paths:
      - "project.godot"
      - "assets/**"
      - "tests/capture_playthrough.gd"
      - "tests/test_capture_ci.py"
      - "scripts/ci/**"
      - ".github/workflows/playthrough-capture.yml"
      - "scenes/**"
      - "scripts/**"
      - "data/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    name: Drive the game under Xvfb and keep evidence
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      # A setup failure still leaves a machine-readable failure in the artifact.
      - name: Initialize evidence
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/playthrough-evidence"
          echo '{"result":"failure","stage":"setup","import":"not_run","capture":"not_run"}' > "$RUNNER_TEMP/playthrough-evidence/status.json"

      - uses: chickensoft-games/setup-godot@v2.4.3
        with:
          version: 4.7.2
          use-dotnet: false

      - name: Test CI success and failure paths
        shell: bash
        run: |
          log="$RUNNER_TEMP/playthrough-evidence/ci-tests.log"
          if CAPTURE_TEST_EVIDENCE_DIR="$RUNNER_TEMP/playthrough-evidence/injected-failures" \
            python3 tests/test_capture_ci.py --real-failures > "$log" 2>&1; then
            cat "$log"
            echo "::notice title=Capture failure-path tests::Simulated paths and real-engine failure injections passed"
          else
            cat "$log"
            echo '{"result":"failure","stage":"failure_path_tests","import":"not_run","capture":"not_run"}' > "$RUNNER_TEMP/playthrough-evidence/status.json"
            detail=$(tail -n 30 "$log" | tr '\n' '|' | cut -c1-4000)
            detail=${detail//'%'/'%25'}
            echo "::error title=Capture failure-path tests failed::$detail"
            exit 1
          fi

      - name: Import and capture
        shell: bash
        run: CAPTURE_EVIDENCE_DIR="$RUNNER_TEMP/playthrough-evidence" scripts/ci/run_playthrough_capture.sh

      # Temporary review aid: removed after inspecting these isolated thumbnails.
      - name: Prepare review thumbnails
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/review-env"
          "$RUNNER_TEMP/review-env/bin/python" -m pip install --quiet Pillow==11.3.0
          cat > "$RUNNER_TEMP/review.py" <<'PY'
          import base64, io, sys
          from pathlib import Path
          from PIL import Image
          source = Path(sys.argv[1])
          original = Image.open(source).convert("RGB")
          for dimensions, quality in (((960, 540), 40), ((640, 360), 30), ((480, 270), 20)):
              image = original.copy()
              image.thumbnail(dimensions)
              output = io.BytesIO()
              image.save(output, "JPEG", quality=quality, optimize=True)
              encoded = base64.b64encode(output.getvalue()).decode()
              chunks = [encoded[i:i + 3600] for i in range(0, len(encoded), 3600)]
              if len(chunks) <= 8:
                  break
          if len(chunks) > 8:
              raise RuntimeError("Review thumbnail too large")
          for index, part in enumerate(chunks):
              print("::notice title=REVIEW_%s_%02d_of_%02d::%s" % (source.stem, index, len(chunks), part))
          PY
      - name: Review 20_estate_exit
        run: '"$RUNNER_TEMP/review-env/bin/python" "$RUNNER_TEMP/review.py" "$RUNNER_TEMP/playthrough-evidence/frames/20_estate_exit.png"'
      - name: Review 21_playground
        run: '"$RUNNER_TEMP/review-env/bin/python" "$RUNNER_TEMP/review.py" "$RUNNER_TEMP/playthrough-evidence/frames/21_playground.png"'
      - name: Review 23_active_result
        run: '"$RUNNER_TEMP/review-env/bin/python" "$RUNNER_TEMP/review.py" "$RUNNER_TEMP/playthrough-evidence/frames/23_active_result.png"'
      - name: Review 24_active_choices_chinese
        run: '"$RUNNER_TEMP/review-env/bin/python" "$RUNNER_TEMP/review.py" "$RUNNER_TEMP/playthrough-evidence/frames/24_active_choices_chinese.png"'
      - name: Review 20_end_card
        run: '"$RUNNER_TEMP/review-env/bin/python" "$RUNNER_TEMP/review.py" "$RUNNER_TEMP/playthrough-evidence/frames/20_end_card.png"'
      - name: Upload status, logs and any frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playthrough-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/playthrough-evidence/
          if-no-files-found: warn

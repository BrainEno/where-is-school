name: Playthrough capture

# Runs the real game in a real window under Xvfb, drives it with simulated keys,
# and saves what the player would see.
#
# Two jobs on purpose:
# - `capture` runs on pull requests, main and on demand, with **read-only**
#   permissions. It fails when the import fails, when the playthrough does not reach
#   its end marker, or when the evidence it staged is malformed. The capture job always
#   attempts to upload staged evidence as a downloadable artifact, including on failures.
# - `verify-evidence` runs for pull requests against the exact artifact produced by
#   `capture`. It downloads and checks that artifact without modifying the checkout.
#
# Captured frames are artifacts, not commits. The older screenshots already in
# `docs/screenshots/` are left untouched; new runs do not write them back to Git.
#
# The artifact has **one** root: `${{ runner.temp }}/evidence`
#   evidence/logs/import-1.log, import-2.log, capture.log
#   evidence/docs/screenshots/*.png, PLAYTHROUGH.log, PLAYTHROUGH.md
# Everything is uploaded from that one directory, so paths are stable when the artifact
# is downloaded. The artifact is addressed by id, not name: each attempt has a distinct
# name, and the exact id is passed to PR verification so it cannot read an older attempt.

on:
  push:
    branches: [main]
    paths:
      - "tests/capture_playthrough.gd"
      - ".github/workflows/playthrough-capture.yml"
      - ".github/actions/evidence-check/**"
      - "scenes/**"
      - "scripts/**"
      - "data/**"
      # Assets belong in this list: the font subset and the authored props change what a
      # frame looks like without touching a scene or a script, and a round that swaps a
      # model should produce the frames that show it (or prove it is out of shot).
      - "assets/**"
      - "project.godot"
      - "addons/**"
      - "tests/capture_editor_dock.gd"
  # `pull_request` has no branch filter: a pull request whose base is another
  # branch - a stacked one - is still a pull request, and until this was removed the
  # only place it could be tested was the branch it was stacked on, or a manual
  # dispatch. `push` stays `main`-only, so nothing runs twice.
  pull_request:
    paths:
      - "tests/capture_playthrough.gd"
      - ".github/workflows/playthrough-capture.yml"
      - ".github/actions/evidence-check/**"
      - "scenes/**"
      - "scripts/**"
      - "data/**"
      # Assets belong in this list: the font subset and the authored props change what a
      # frame looks like without touching a scene or a script, and a round that swaps a
      # model should produce the frames that show it (or prove it is out of shot).
      - "assets/**"
      - "project.godot"
      - "addons/**"
      - "tests/capture_editor_dock.gd"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    name: Drive the game under Xvfb and save the frames
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      # The id of the artifact **this attempt** uploaded. PR verification downloads by id,
      # so a re-run cannot resolve to an older attempt's evidence.
      evidence_artifact_id: ${{ steps.upload_evidence.outputs.artifact-id }}
      shot_count: ${{ steps.capture.outputs.shot_count }}
    steps:
      - uses: actions/checkout@v6

      - uses: chickensoft-games/setup-godot@v2.4.3
        with:
          version: 4.7.2
          use-dotnet: false

      - name: Prepare the evidence folder
        shell: bash
        run: |
          set -uo pipefail
          # RUNNER_TEMP is the one directory every step below agrees on. It is not a
          # path inside the workspace, so nothing the capture writes into the project
          # can end up in the artifact by accident.
          EVIDENCE="${RUNNER_TEMP}/evidence"
          rm -rf "${EVIDENCE}"
          mkdir -p "${EVIDENCE}/logs" "${EVIDENCE}/docs/screenshots"
          echo "EVIDENCE=${EVIDENCE}" >> "${GITHUB_ENV}"
          find "${EVIDENCE}" -maxdepth 3 | sort

      - name: Static syntax check
        id: parse
        shell: bash
        run: |
          # The engine's import pass only compiles the scripts something actually
          # loads, so a broken file nothing references can sit in the tree and the
          # import still exits 0. gdtoolkit's parser reads every file, without
          # needing a display or an engine instance. It is a CI-only tool: nothing
          # from it ships with the game.
          set -uo pipefail
          python3 -m venv /tmp/lint >/dev/null 2>&1
          /tmp/lint/bin/pip install --quiet "gdtoolkit==4.5.0"
          # `addons/` is included: the editor dock is first-party code and has to parse.
          mapfile -t files < <(find . -name '*.gd' -not -path './.godot/*' | sort)
          echo "checking ${#files[@]} GDScript file(s)"
          if ! /tmp/lint/bin/gdparse "${files[@]}"; then
            echo "PARSE_RESULT=failure"
            echo "::error title=GDScript syntax::gdparse rejected at least one file (see the step log)"
            exit 1
          fi
          echo "PARSE_RESULT=success"

      - name: Import project
        id: import
        shell: bash
        run: |
          set -uo pipefail
          EVIDENCE="${RUNNER_TEMP}/evidence"
          # Two passes, on purpose. The first scans a fresh checkout, where an
          # asset that another resource points at may not have been imported yet
          # (the bundled CJK font is the usual one), so it may report a dependency
          # that the scan itself is about to create. The second pass starts from a
          # populated import cache: every remaining parse error is real, and this
          # is the pass whose result is trusted.
          # The logs live in the staged folder from the start, so what is uploaded is
          # exactly what was checked.
          first_log="${EVIDENCE}/logs/import-1.log"
          second_log="${EVIDENCE}/logs/import-2.log"
          # The first pass is `--import`, not `--editor --quit`: `--quit` returns after
          # one frame while the first scan is still on its worker thread, and with the
          # `.import` sidecars now tracked in the repository an asset that was not
          # imported is not loadable from its source either (the sidecar routes it
          # through `.godot/imported/...`). `--import` waits for the queue to drain.
          run_blocking_import () {
            local log="$1"
            godot --headless --path . --import > "${log}" 2>&1
            return $?
          }

          run_import () {
            local log="$1"
            godot --headless --editor --path . --quit > "${log}" 2>&1
            return $?
          }

          run_blocking_import "${first_log}"
          first=$?
          grep -E "SCRIPT ERROR|Parse Error|ERROR:" "${first_log}" | head -n 20 || true
          if [ "${first}" -ne 0 ]; then
            summary=$(grep -E "SCRIPT ERROR|Parse Error|ERROR:" "${first_log}" | head -n 10 | tr '\n' '|' | cut -c1-1500)
            echo "IMPORT_RESULT=failure"
            echo "::error title=import failed (exit ${first})::${summary:-no summary captured}"
            exit "${first}"
          fi

          run_import "${second_log}"
          second=$?
          grep -E "SCRIPT ERROR|Parse Error|ERROR:" "${second_log}" | head -n 20 || true
          if [ "${second}" -ne 0 ]; then
            summary=$(grep -E "SCRIPT ERROR|Parse Error|ERROR:" "${second_log}" | head -n 10 | tr '\n' '|' | cut -c1-1500)
            echo "IMPORT_RESULT=failure"
            echo "::error title=import failed on the second pass (exit ${second})::${summary:-no summary captured}"
            exit "${second}"
          fi
          # A non-zero exit is not the only way an import breaks: a script that
          # fails to parse is reported in the log while the editor still quits.
          if grep -qE "SCRIPT ERROR|Parse Error" "${second_log}"; then
            summary=$(grep -E "SCRIPT ERROR|Parse Error" "${second_log}" | head -n 10 | tr '\n' '|' | cut -c1-1500)
            echo "IMPORT_RESULT=failure"
            echo "::error title=import reported script errors::${summary}"
            exit 1
          fi
          echo "IMPORT_RESULT=success"

      - name: Capture the playthrough
        id: capture
        shell: bash
        run: |
          # GitHub runs bash steps with -e, which would end the step at the first
          # non-zero command and throw the log away. The capture is allowed to fail so
          # the frames it did save are kept and the reason is reported; the step still
          # fails at the end: a run that did not reach its end marker must not look
          # green.
          set +e -uo pipefail
          EVIDENCE="${RUNNER_TEMP}/evidence"
          capture_log="${EVIDENCE}/logs/capture.log"
          mkdir -p docs/screenshots
          # Everything the script writes has to be newer than this stamp for the step to
          # believe it: `docs/screenshots/` is also where the committed frames live, and
          # the folder used to be copied wholesale into the evidence. That let a stale
          # PLAYTHROUGH.log from an old run answer for this one — two runs fourteen
          # minutes apart reported the same line, and the step passed on evidence it had
          # not produced. The stamp is what separates "written now" from "committed".
          stamp="${RUNNER_TEMP}/capture-stamp"
          : > "${stamp}"
          xvfb-run -a --server-args="-screen 0 1600x900x24" \
            godot --path . --resolution 1600x900 --rendering-driver opengl3 \
            --script res://tests/capture_playthrough.gd > "${capture_log}" 2>&1
          code=$?
          echo "capture exit=${code}"
          grep -E "CAPTURE|SCRIPT ERROR|ERROR:" "${capture_log}" | tail -n 60 || true
          ls -l docs/screenshots || true
          # The frames this run wrote into the project folder are staged, not moved: the
          # working tree is never the thing that gets uploaded, and a file that was
          # already there before this run is not this run's evidence.
          written=0
          if [ -d docs/screenshots ]; then
            written=$(find docs/screenshots -maxdepth 1 -type f -name '*.png' -newer "${stamp}" | wc -l)
            find docs/screenshots -maxdepth 1 -type f -newer "${stamp}" \
              -exec cp -a {} "${EVIDENCE}/docs/screenshots/" \; || true
          fi
          staged=$(find "${EVIDENCE}/docs/screenshots" -maxdepth 1 -name '*.png' | wc -l)
          echo "staged frames: ${staged} (written by this run: ${written})"
          if [ "${written}" -lt 4 ] || [ ! -f "${EVIDENCE}/docs/screenshots/PLAYTHROUGH.log" ]; then
            # No fresh frame and no fresh log: say what the engine said, rather than
            # reading a verdict off a file that was committed weeks ago.
            errors=$(grep -E "SCRIPT ERROR|ERROR:|Parse Error|error" "${capture_log}" 2>/dev/null \
              | head -n 8 | tr '\n' '|' | cut -c-1200) || true
            tail_lines=$(tail -n 3 "${capture_log}" 2>/dev/null | tr '\n' '|' | cut -c-600) || true
            echo "::error title=playthrough capture wrote nothing (exit ${code})::${errors:-no error lines in the capture log} :: tail: ${tail_lines:-empty log}"
            exit 1
          fi

          # "never appeared" carries the position, the target and the prompt the script
          # actually saw, which is the only place that says why a prompt shot is missing.
          # `cue audio` carries the interaction cue counts. A sound cannot be photographed,
          # so the numbers the run's real clicks produced are the evidence for it.
          summary=$(grep -E "FAILURE|RESULT|never appeared|cue audio|cue candidates" "${EVIDENCE}/docs/screenshots/PLAYTHROUGH.log" 2>/dev/null | tr '\n' '|' | cut -c1-1800) || true
          # The script's own verdict decides, not the process exit code. `quit(0)` does
          # set it, but a windowed run under Xvfb also exits non-zero sometimes while
          # the engine tears down its window and GL context, after the playthrough has
          # finished and the log has been written. That is noise about teardown, not
          # about the game. A run that never wrote its marker — because it stopped
          # early or died mid-coroutine — still fails here, as does one that wrote a
          # FAILURE line.
          if grep -qE "FAILURE: " "${EVIDENCE}/docs/screenshots/PLAYTHROUGH.log" 2>/dev/null; then
            echo "CAPTURE_RESULT=failure"
            echo "::error title=playthrough reported a failure (exit ${code})::${summary:-no summary}"
            exit 1
          fi
          if ! grep -qE "^\[[^]]*\] RESULT: " "${EVIDENCE}/docs/screenshots/PLAYTHROUGH.log" 2>/dev/null; then
            echo "CAPTURE_RESULT=failure"
            echo "::error title=playthrough ended without a result marker (exit ${code})::${summary:-no log}"
            exit 1
          fi
          if [ "${code}" -ne 0 ]; then
            echo "::warning title=playthrough::the run exited ${code} after writing its result marker; teardown, not the playthrough"
          fi
          echo "CAPTURE_RESULT=success"
          echo "shot_count=${staged}" >> "$GITHUB_OUTPUT"
          echo "::notice title=playthrough::${summary:-capture finished}"
          # The names, not just the count: which frames a run produced is the first thing
          # a reviewer asks; both the images and the log can be downloaded from the run artifact.
          echo "::notice title=playthrough frames::$(grep -oE 'screenshot [a-z0-9_]+' \
            "${EVIDENCE}/docs/screenshots/PLAYTHROUGH.log" | sed 's/screenshot //' \
            | tr '\n' ' ' | cut -c-1400)"

      - name: Capture the dialogue layout
        id: ui_capture
        shell: bash
        run: |
          # A second window run, for the text rather than the walk. It boots the same
          # main scene and photographs the real dialogue panel at three resolutions in
          # both languages, plus a real choice list, an inspection, a recollection and
          # the log. The step fails when fewer frames than that arrive, so a silently
          # empty capture cannot pass as evidence.
          set +e -uo pipefail
          EVIDENCE="${RUNNER_TEMP}/evidence"
          ui_log="${EVIDENCE}/logs/ui-capture.log"
          mkdir -p docs/screenshots
          xvfb-run -a --server-args="-screen 0 1920x1080x24" \
            godot --path . --resolution 1600x900 --rendering-driver opengl3 \
            --script res://tests/capture_dialogue_ui.gd > "${ui_log}" 2>&1
          code=$?
          echo "dialogue capture exit=${code}"
          grep -E "SHOT|FAILURE|PASS|SCRIPT ERROR|ERROR:" "${ui_log}" | tail -n 40 || true
          if [ -d docs/screenshots ]; then
            cp -a docs/screenshots/ui-*.png "${EVIDENCE}/docs/screenshots/" 2>/dev/null || true
            cp -a docs/screenshots/UI_CAPTURE.log "${EVIDENCE}/docs/screenshots/" 2>/dev/null || true
          fi
          staged=$(find "${EVIDENCE}/docs/screenshots" -maxdepth 1 -name 'ui-*.png' | wc -l)
          echo "staged dialogue frames: ${staged}"
          if [ "${staged}" -lt 6 ]; then
            echo "UI_CAPTURE_RESULT=failure"
            echo "::error title=dialogue capture::only ${staged} dialogue frame(s) were produced"
            exit 1
          fi
          if grep -qE "^FAILURE: " "${EVIDENCE}/docs/screenshots/UI_CAPTURE.log" 2>/dev/null; then
            echo "UI_CAPTURE_RESULT=failure"
            echo "::error title=dialogue capture::the script reported a failure"
            exit 1
          fi
          if ! grep -qE "^RESULT: " "${EVIDENCE}/docs/screenshots/UI_CAPTURE.log" 2>/dev/null; then
            echo "UI_CAPTURE_RESULT=failure"
            echo "::error title=dialogue capture::the script wrote no result marker"
            exit 1
          fi
          echo "UI_CAPTURE_RESULT=success"

      - name: Capture the narrative editor dock
        id: editor_capture
        shell: bash
        run: |
          # The third window run, and the only one that photographs a tool rather than the
          # game: the editor dock instantiated in a plain window, showing the real content.
          # It exists because the dock normally lives inside the editor, which no CI runner
          # opens — this is the closest a headless pipeline gets to a screenshot of it, and
          # the pull request needs one.
          set +e -uo pipefail
          EVIDENCE="${RUNNER_TEMP}/evidence"
          editor_log="${EVIDENCE}/logs/editor-capture.log"
          mkdir -p docs/screenshots
          xvfb-run -a --server-args="-screen 0 1920x1080x24" \
            godot --path . --resolution 1600x1000 --rendering-driver opengl3 \
            --script res://tests/capture_editor_dock.gd > "${editor_log}" 2>&1
          code=$?
          echo "editor capture exit=${code}"
          grep -E "SHOT|FAILURE|PASS|SCRIPT ERROR|ERROR:" "${editor_log}" | tail -n 40 || true
          if [ -d docs/screenshots ]; then
            cp -a docs/screenshots/editor-dock-*.png "${EVIDENCE}/docs/screenshots/" 2>/dev/null || true
            cp -a docs/screenshots/EDITOR_CAPTURE.log "${EVIDENCE}/docs/screenshots/" 2>/dev/null || true
          fi
          staged=$(find "${EVIDENCE}/docs/screenshots" -maxdepth 1 -name 'editor-dock-*.png' | wc -l)
          echo "staged editor frames = ${staged}"
          # The step log is not always reachable from where a failure is read — a
          # restricted client only sees annotations — so every result below carries the
          # reason with it. Three parts, in the order they explain a failed capture:
          # the exit code, the script's own markers and the engine's errors, and the end
          # of the run's output.
          script_log="${EVIDENCE}/docs/screenshots/EDITOR_CAPTURE.log"
          marks=$(grep -E "SHOT|^FAILURE|^PASS|^RESULT|SCRIPT ERROR|Parse Error" "${editor_log}" 2>/dev/null | head -n 12 | tr '\n' '|' | cut -c1-1200) || true
          run_tail=$(tail -n 3 "${editor_log}" 2>/dev/null | tr '\n' '|' | cut -c1-400) || true
          reasons=$(grep -E "^FAILURE: " "${script_log}" 2>/dev/null | head -n 5 | tr '\n' '|' | cut -c1-600) || true
          why="exit=${code} :: markers: ${marks:-none} :: tail: ${run_tail:-none} :: script log: ${reasons:-absent}"
          if [ "${staged}" -lt 4 ]; then
            echo "EDITOR_CAPTURE_RESULT=failure"
            echo "::error title=narrative editor capture::only ${staged} frame(s) were produced :: ${why}"
            exit 1
          fi
          if grep -qE "^FAILURE: " "${script_log}" 2>/dev/null; then
            echo "EDITOR_CAPTURE_RESULT=failure"
            echo "::error title=narrative editor capture::the script reported a failure :: ${why}"
            exit 1
          fi
          if ! grep -qE "^RESULT: " "${script_log}" 2>/dev/null; then
            echo "EDITOR_CAPTURE_RESULT=failure"
            echo "::error title=narrative editor capture::the script wrote no result marker :: ${why}"
            exit 1
          fi
          echo "EDITOR_CAPTURE_RESULT=success"
          echo "::notice title=narrative editor capture::${staged} frame(s) :: $(grep -E '^RESULT: ' "${script_log}" | tr '\n' '|')"

      - name: Stage the frame list
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          EVIDENCE="${RUNNER_TEMP}/evidence"
          # A plain, inspectable record of what the run produced: this is the evidence
          # that the artifact structure is not a guess.
          {
            echo "evidence root: ${EVIDENCE}"
            echo "--- files ---"
            find "${EVIDENCE}" -type f | sort
            echo "--- frames: $(find "${EVIDENCE}/docs/screenshots" -maxdepth 1 -name '*.png' | wc -l) ---"
          } | tee "${EVIDENCE}/logs/staged-files.txt"

      # 临时（#82 PR 内将回退）：在真实截图上测量操场 HUD 文字背后的亮度与对比度，只读，不写入证据目录。
      - name: Measure the schoolyard HUD contrast (temporary, #82)
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          python3 -m pip install --quiet pillow || exit 0
          python3 - <<'PY'
          import base64, io, os
          from PIL import Image
          d = os.path.join(os.environ["RUNNER_TEMP"], "evidence", "docs", "screenshots")
          def lin(v):
              v = v / 255.0
              return v / 12.92 if v <= 0.04045 else ((v + 0.055) / 1.055) ** 2.4
          def lum(p):
              return 0.2126 * lin(p[0]) + 0.7152 * lin(p[1]) + 0.0722 * lin(p[2])
          def band(im, box):
              px = sorted(lum(p) for p in im.crop(box).getdata())
              return px[len(px) // 2]
          names = ["13f_schoolyard_from_corridor", "25_playground_wide", "26_hoop_prompt",
                   "27_hoop_inspection", "28_shed_prompt", "32_far_gap_prompt"]
          rows = []
          for n in names:
              f = os.path.join(d, n + ".png")
              if not os.path.exists(f):
                  rows.append(n + " missing")
                  continue
              im = Image.open(f).convert("RGB")
              o = band(im, (54, 40, 560, 74))
              p = band(im, (500, 826, 1100, 860))
              rows.append("%s sentence bg L %.3f CR %.2f / prompt bg L %.3f CR %.2f"
                          % (n[:3], o, (0.502 + 0.05) / (o + 0.05), p, (0.659 + 0.05) / (p + 0.05)))
          print("::notice title=schoolyard HUD contrast (measured)::" + " | ".join(rows))
          for n in ["25_playground_wide", "28_shed_prompt", "32_far_gap_prompt"]:
              f = os.path.join(d, n + ".png")
              if os.path.exists(f):
                  im = Image.open(f).convert("RGB").resize((320, 180))
                  for k in range(3):
                      b = io.BytesIO()
                      im.crop((0, 60 * k, 320, 60 * k + 60)).save(b, "JPEG", quality=55)
                      print("::notice title=strip %s %d::%s" % (n, k, base64.b64encode(b.getvalue()).decode()))
          PY

      - name: Summarise the result
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          {
            echo "### Playthrough capture"
            echo ""
            echo "| check | result |"
            echo "| --- | --- |"
            echo "| syntax | ${PARSE_OUTCOME:-unknown} |"
            echo "| import | ${IMPORT_OUTCOME:-unknown} |"
            echo "| capture | ${CAPTURE_OUTCOME:-unknown} |"
            echo "| dialogue frames | ${UI_CAPTURE_OUTCOME:-unknown} |"
            echo "| editor dock frames | ${EDITOR_CAPTURE_OUTCOME:-unknown} |"
            echo ""
            echo "Screenshots: ${SHOT_COUNT:-0} frame file(s) staged in docs/screenshots."
            echo "Log and frames: download \`playthrough-evidence-${GITHUB_RUN_ATTEMPT}\` from this workflow run."
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          PARSE_OUTCOME: ${{ steps.parse.outcome }}
          IMPORT_OUTCOME: ${{ steps.import.outcome }}
          CAPTURE_OUTCOME: ${{ steps.capture.outcome }}
          UI_CAPTURE_OUTCOME: ${{ steps.ui_capture.outcome }}
          EDITOR_CAPTURE_OUTCOME: ${{ steps.editor_capture.outcome }}
          SHOT_COUNT: ${{ steps.capture.outputs.shot_count }}

      - name: Upload the evidence
        id: upload_evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # The attempt number belongs in the name: a re-run must not look like the run
          # before it, and a name that repeats inside one run is a name that cannot be
          # resolved to one artifact. The id below is what the jobs downstream use.
          name: playthrough-evidence-${{ github.run_attempt }}
          # One path, so the artifact's root is this folder and nothing else.
          path: ${{ runner.temp }}/evidence
          if-no-files-found: warn

      - name: Record the evidence artifact
        if: always()
        shell: bash
        env:
          ARTIFACT_ID: ${{ steps.upload_evidence.outputs.artifact-id }}
          ARTIFACT_URL: ${{ steps.upload_evidence.outputs.artifact-url }}
        run: |
          set -uo pipefail
          # Written down rather than inferred: which run, which attempt and which
          # artifact a reader of the summary or the PR should open.
          record="run ${GITHUB_RUN_ID} attempt ${GITHUB_RUN_ATTEMPT} artifact ${ARTIFACT_ID:-none}"
          {
            echo ""
            echo "| run | attempt | evidence artifact |"
            echo "| --- | --- | --- |"
            echo "| ${GITHUB_RUN_ID} | ${GITHUB_RUN_ATTEMPT} | ${ARTIFACT_ID:-none} |"
            echo ""
            echo "\`${record}\`"
            if [ -n "${ARTIFACT_URL:-}" ]; then
              echo "[Download playthrough evidence](${ARTIFACT_URL})"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          echo "EVIDENCE_ARTIFACT=${record}"
          if [ -z "${ARTIFACT_ID:-}" ]; then
            echo "::warning title=evidence artifact::the upload reported no artifact id; the jobs below download by id and will say so"
          fi
          echo "::notice title=evidence artifact::${record} ${ARTIFACT_URL:-}"

  verify-evidence:
    name: Verify the playthrough artifact (pull requests only)
    needs: capture
    if: github.event_name == 'pull_request' && needs.capture.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Check the artifact id is the one to read
        shell: bash
        env:
          ARTIFACT_ID: ${{ needs.capture.outputs.evidence_artifact_id }}
        run: |
          set -uo pipefail
          if [ -z "${ARTIFACT_ID:-}" ]; then
            echo "::error title=no artifact id::the capture job reported no evidence_artifact_id, so there is nothing this job could verify"
            exit 1
          fi
          echo "verifying artifact ${ARTIFACT_ID} from attempt ${{ github.run_attempt }}"

      - name: Download the artifact
        uses: actions/download-artifact@v4
        with:
          # By id, not by name: see the note at the top of this file.
          artifact-ids: ${{ needs.capture.outputs.evidence_artifact_id }}
          # Downloaded beside the place the checks read, not into it: the next step
          # accepts either shape this action can produce.
          path: ${{ runner.temp }}/download

      - name: Put the evidence where the checks look for it
        shell: bash
        env:
          DOWNLOAD: ${{ runner.temp }}/download
          EVIDENCE: ${{ runner.temp }}/evidence
        run: |
          set -o pipefail
          # A downloaded artifact that is not where the checks look is the failure mode
          # this step exists for, so every way it can go wrong says so in an annotation
          # instead of ending as an exit code with no message.
          echo "download directory: ${DOWNLOAD}"
          if [ ! -d "${DOWNLOAD}" ]; then
            echo "::error title=no download directory::${DOWNLOAD} does not exist"
            exit 1
          fi
          echo "downloaded tree:"
          find "${DOWNLOAD}" -maxdepth 4 -mindepth 1 -print 2>/dev/null | sort | head -n 60 || true
          echo "end of downloaded tree"
          log_path=""
          while IFS= read -r candidate; do
            log_path="${candidate}"
            break
          done < <(find "${DOWNLOAD}" -type f -name PLAYTHROUGH.log -print 2>/dev/null)
          if [ -z "${log_path}" ]; then
            echo "::error title=the artifact holds no playthrough log::no PLAYTHROUGH.log anywhere under ${DOWNLOAD}, so this is not the evidence this job is supposed to check"
            exit 1
          fi
          # PLAYTHROUGH.log lives in <evidence>/docs/screenshots/, so its grandparent is
          # the folder the checks were written against, whatever depth the download
          # action chose.
          root=$(dirname "$(dirname "$(dirname "${log_path}")")")
          echo "evidence root: ${root}"
          mkdir -p "${EVIDENCE}"
          if ! cp -a "${root}/." "${EVIDENCE}/"; then
            echo "::error title=the evidence could not be staged::copying ${root} into ${EVIDENCE} failed"
            exit 1
          fi
          echo "staged evidence:"
          find "${EVIDENCE}" -maxdepth 3 -mindepth 1 -print 2>/dev/null | sort | head -n 60 || true
          echo "end of staged evidence"
          exit 0

      - name: Verify the structure and the logs
        uses: ./.github/actions/evidence-check
        with:
          evidence: ${{ runner.temp }}/evidence

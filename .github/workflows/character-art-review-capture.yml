name: Character art review capture

# Issue #188: photographs the character art review experiments in the running game. They
# live in scenes/dev/character_art_review/ (development only, excluded from the export) and
# are put on the production protagonist and Q wrappers at run time, never on disk.
#
# Two kinds of job:
#   check    tests/character_art_review_test.gd under Xvfb + OpenGL: every parameter the
#            review looks set is a uniform their shaders declare, every surface is replaced,
#            the pose overlay at intensity 0 is the production pose exactly, and the hair edit
#            and the restore work.
#   capture  tests/capture_character_art_review.gd, one job per group, same machinery as the
#            production character art capture (which it extends, unchanged): C (shipped),
#            C + experiment A (pose), and directions D1 / D2 / D3, side by side.
#
# The contact sheets are published as notices exactly as in character-art-capture.yml: each
# JPEG is base64 split into numbered 4000-character parts. The full frames are the artifact.

on:
  pull_request:
    paths:
      - "scenes/dev/character_art_review/**"
      - "tests/capture_character_art_review.gd"
      - "tests/character_art_review_test.gd"
      - "tests/capture_character_art.gd"
      - ".github/workflows/character-art-review-capture.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Character art review (check)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: chickensoft-games/setup-godot@ac93246ea68518a384c1c280a496e5989341f2f6 # v2.4.3
        with:
          version: 4.7.2
          use-dotnet: false

      - name: Import project
        shell: bash
        run: |
          set -uo pipefail
          godot --headless --path . --import > import-1.log 2>&1 || true
          godot --headless --editor --path . --quit > import-2.log 2>&1
          code=$?
          if [ "${code}" -ne 0 ] || grep -qE "SCRIPT ERROR|Parse Error" import-2.log; then
            summary=$(grep -E "SCRIPT ERROR|Parse Error|ERROR:" import-2.log | head -n 10 | tr '\n' '|' | cut -c1-1500)
            echo "::error title=import failed (exit ${code})::${summary:-no summary}"
            exit 1
          fi

      - name: Check
        shell: bash
        run: |
          set +e -uo pipefail
          xvfb-run -a --server-args="-screen 0 1600x900x24" \
            godot --path . --resolution 1600x900 --rendering-driver opengl3 \
            --script res://tests/character_art_review_test.gd > check.log 2>&1
          code=$?
          cat check.log | cut -c1-400 | tail -n 150
          lines=$(grep -vE "^(Godot Engine|OpenGL API|$)" check.log | grep -E "^(look |c on|d[123] on|protagonist|Q right|hair|hesitation|FAILURE|RESULT)" | tr '\n' '|')
          echo "::notice title=character art review check::${lines:0:3900}"
          if grep -qE "SHADER ERROR|SCRIPT ERROR" check.log; then
            errors=$(grep -E -A3 "SHADER ERROR|SCRIPT ERROR" check.log | head -n 24 | tr '\n' '|' | cut -c1-1800)
            echo "::error title=character art review check: shader or script error::${errors}"
            exit 1
          fi
          if [ "${code}" -ne 0 ] || ! grep -qE "RESULT: SUCCESS" check.log; then
            failures=$(grep -E "FAILURE: |ERROR:" check.log | head -n 12 | tr '\n' '|' | cut -c1-1800)
            echo "::error title=character art review check failed (exit ${code})::${failures:-no failure lines}"
            exit 1
          fi

  capture:
    name: Character art review (${{ matrix.group }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        group: [review_bodies, review_faces, review_gameplay, review_light]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: chickensoft-games/setup-godot@ac93246ea68518a384c1c280a496e5989341f2f6 # v2.4.3
        with:
          version: 4.7.2
          use-dotnet: false

      - name: Import project
        shell: bash
        run: |
          set -uo pipefail
          # Blocking import first (it waits for the queue to drain), then an editor pass
          # whose log is the one that must be free of script errors. Same as the
          # playthrough capture.
          godot --headless --path . --import > import-1.log 2>&1 || true
          godot --headless --editor --path . --quit > import-2.log 2>&1
          code=$?
          if [ "${code}" -ne 0 ] || grep -qE "SCRIPT ERROR|Parse Error" import-2.log; then
            summary=$(grep -E "SCRIPT ERROR|Parse Error|ERROR:" import-2.log | head -n 10 | tr '\n' '|' | cut -c1-1500)
            echo "::error title=import failed (exit ${code})::${summary:-no summary}"
            exit 1
          fi

      - name: Capture
        id: capture
        shell: bash
        run: |
          set +e -uo pipefail
          mkdir -p docs/screenshots/character_art
          xvfb-run -a --server-args="-screen 0 1600x900x24" \
            godot --path . --resolution 1600x900 --rendering-driver opengl3 \
            --script res://tests/capture_character_art_review.gd -- --group=${{ matrix.group }} > capture.log 2>&1
          code=$?
          grep -E "^ARTNOTE: |SCRIPT ERROR|ERROR:" capture.log | cut -c1-400 | tail -n 120 || true
          grep -E "^ARTSHEET: " capture.log > sheets.txt || true
          # Every part of every sheet, one per line, in order: "<file> <i> <n> <data>".
          : > parts.txt
          while read -r _ file data; do
            n=$(( (${#data} + 3999) / 4000 ))
            for i in $(seq 1 "${n}"); do
              echo "${file} ${i} ${n} ${data:$(( (i - 1) * 4000 )):4000}" >> parts.txt
            done
          done < sheets.txt
          echo "sheet parts: $(wc -l < parts.txt)"
          notes=$(grep -E "^ARTNOTE: " capture.log | sed 's/^ARTNOTE: \[[^]]*\] //' \
            | grep -vE "^(published|sheet) " | tr '\n' '|')
          echo "::notice title=character art review ${{ matrix.group }} measurements 1::${notes:0:3800}"
          [ "${#notes}" -gt 3800 ] && echo "::notice title=character art review ${{ matrix.group }} measurements 2::${notes:3800:3800}"
          [ "${#notes}" -gt 7600 ] && echo "::notice title=character art review ${{ matrix.group }} measurements 3::${notes:7600:3800}"
          [ "${#notes}" -gt 11400 ] && echo "::notice title=character art review ${{ matrix.group }} measurements 4::${notes:11400:3800}"
          if grep -qE "SHADER ERROR" capture.log; then
            errors=$(grep -E -A3 "SHADER ERROR" capture.log | head -n 16 | tr '\n' '|' | cut -c1-1500)
            echo "::error title=character art review ${{ matrix.group }}: shader error::${errors}"
          fi
          if grep -qE "RESULT: FAILURE" capture.log; then
            failures=$(grep -E "FAILURE: " capture.log | sed 's/^ARTNOTE: \[[^]]*\] //' | tr '\n' '|' | cut -c1-1500)
            echo "::error title=character art review ${{ matrix.group }} failed (exit ${code})::${failures}"
            exit 1
          fi
          if ! grep -qE "RESULT: SUCCESS" capture.log; then
            tail_lines=$(grep -E "SCRIPT ERROR|ERROR:" capture.log | head -n 8 | tr '\n' '|' | cut -c1-1200)
            echo "::error title=character art review ${{ matrix.group }} ended without a result (exit ${code})::${tail_lines:-no error lines}"
            exit 1
          fi

      - name: Publish sheets (parts 1-10)
        if: always()
        shell: bash
        run: |
          [ -s parts.txt ] || exit 0
          sed -n '1,10p' parts.txt | while read -r file i n data; do
            echo "::notice title=character art review crop ${file} part ${i}/${n}::${data}"
          done

      - name: Publish sheets (parts 11-20)
        if: always()
        shell: bash
        run: |
          [ -s parts.txt ] || exit 0
          sed -n '11,20p' parts.txt | while read -r file i n data; do
            echo "::notice title=character art review crop ${file} part ${i}/${n}::${data}"
          done

      - name: Publish sheets (parts 21-30)
        if: always()
        shell: bash
        run: |
          [ -s parts.txt ] || exit 0
          sed -n '21,30p' parts.txt | while read -r file i n data; do
            echo "::notice title=character art review crop ${file} part ${i}/${n}::${data}"
          done

      - name: Publish sheets (parts 31-40)
        if: always()
        shell: bash
        run: |
          [ -s parts.txt ] || exit 0
          sed -n '31,40p' parts.txt | while read -r file i n data; do
            echo "::notice title=character art review crop ${file} part ${i}/${n}::${data}"
          done

      - name: Upload the frames
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: character-art-review-${{ matrix.group }}-${{ github.run_attempt }}
          path: |
            docs/screenshots/character_art/
            capture.log
          if-no-files-found: warn
          retention-days: 14

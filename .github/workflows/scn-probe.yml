# TEMPORARY (issue #383): measure what Godot's importer actually stores for the
# protagonist -- the imported .scn broke the 1.50 MiB model budget and the run log
# is not readable from the sandbox that needs this data, so the composition is
# printed as annotations from a job with almost no other annotations to spend.
# Remove this workflow together with tools/scn_probe.gd once the budget question
# is settled.
name: Temporary scn probe
on:
  workflow_dispatch:
  push:
    branches:
      - arena/2141d81f-where-is-school
jobs:
  probe:
    name: Probe the imported protagonist scene
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # The second step swaps in the pre-PR model with `git show <base sha>`, so
          # the full history must be present on a default-depth clone.
          fetch-depth: 0

      - uses: ./.github/actions/setup-godot

      - name: Import the branch's model and probe the imported scene
        shell: bash
        run: |
          set -uo pipefail
          status=0
          godot --headless --path . --import > /tmp/import-head.log 2>&1 || status=$?
          echo "::notice title=head import::exit ${status}"
          grep -E 'SCRIPT ERROR|Parse Error' /tmp/import-head.log | head -5 | sed 's/^/::notice title=head import error::/' || true
          found=0
          for f in .godot/imported/Protagonist_Character.glb-*.scn; do
            [ -e "$f" ] || continue
            found=1
            echo "::notice title=head scn::$(stat -c%s "$f") bytes"
          done
          [ "${found}" = 1 ] || echo "::notice title=head scn::ABSENT after import"
          timeout 180 godot --headless --path . --script res://tools/scn_probe.gd 2>&1 \
            | sed -n 's/^PROBE /::notice title=head probe:: /p' || true

      - name: Swap in the pre-PR model and probe again
        shell: bash
        run: |
          set -uo pipefail
          git show 7a39c178f4fbc954b051510bdbdff6fce907a63e:assets/models/protagonist/Protagonist_Character.glb \
            > assets/models/protagonist/Protagonist_Character.glb
          rm -f .godot/imported/Protagonist_Character*
          status=0
          godot --headless --path . --import > /tmp/import-base.log 2>&1 || status=$?
          echo "::notice title=base import::exit ${status}"
          grep -E 'SCRIPT ERROR|Parse Error' /tmp/import-base.log | head -5 | sed 's/^/::notice title=base import error::/' || true
          found=0
          for f in .godot/imported/Protagonist_Character.glb-*.scn; do
            [ -e "$f" ] || continue
            found=1
            echo "::notice title=base scn::$(stat -c%s "$f") bytes"
          done
          [ "${found}" = 1 ] || echo "::notice title=base scn::ABSENT after import"
          timeout 180 godot --headless --path . --script res://tools/scn_probe.gd 2>&1 \
            | sed -n 's/^PROBE /::notice title=base probe:: /p' || true

      - name: Reimport with animation import disabled
        shell: bash
        run: |
          set -uo pipefail
          git checkout -- assets/models/protagonist/Protagonist_Character.glb
          sed -i 's/^animation\/import=true$/animation\/import=false/' \
            assets/models/protagonist/Protagonist_Character.glb.import
          grep -E '^(animation/import|meshes/ensure_tangents)=' assets/models/protagonist/Protagonist_Character.glb.import \
            | sed 's/^/::notice title=noanim params::/' || true
          rm -f .godot/imported/Protagonist_Character*
          status=0
          godot --headless --path . --import > /tmp/import-noanim.log 2>&1 || status=$?
          echo "::notice title=noanim import::exit ${status}"
          found=0
          for f in .godot/imported/Protagonist_Character.glb-*.scn; do
            [ -e "$f" ] || continue
            found=1
            echo "::notice title=noanim scn::$(stat -c%s "$f") bytes (animation import off)"
          done
          [ "${found}" = 1 ] || echo "::notice title=noanim scn::ABSENT after import"

      - name: Reimport with tangent generation disabled
        shell: bash
        run: |
          set -uo pipefail
          git checkout -- assets/models/protagonist/Protagonist_Character.glb.import
          sed -i 's/^meshes\/ensure_tangents=true$/meshes\/ensure_tangents=false/' \
            assets/models/protagonist/Protagonist_Character.glb.import
          grep -E '^(animation/import|meshes/ensure_tangents)=' assets/models/protagonist/Protagonist_Character.glb.import \
            | sed 's/^/::notice title=notan params::/' || true
          rm -f .godot/imported/Protagonist_Character*
          status=0
          godot --headless --path . --import > /tmp/import-notan.log 2>&1 || status=$?
          echo "::notice title=notan import::exit ${status}"
          found=0
          for f in .godot/imported/Protagonist_Character.glb-*.scn; do
            [ -e "$f" ] || continue
            found=1
            echo "::notice title=notan scn::$(stat -c%s "$f") bytes (ensure_tangents off)"
          done
          [ "${found}" = 1 ] || echo "::notice title=notan scn::ABSENT after import"

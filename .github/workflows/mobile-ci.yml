name: Mobile input regression

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - '.github/workflows/mobile-ci.yml'
      - '.github/actions/setup-godot/**'
      - '.godot-version'
      - 'project.godot'
      - 'export_presets.cfg'
      - 'packaging/version.txt'
      - 'default_bus_layout.tres'
      - 'scripts/**'
      - 'scenes/**'
      - 'assets/**'
      - 'data/**'
      - 'tests/mobile*'
      - 'tests/capture_mobile_controls.gd'
      - 'tests/test_harness.gd'
      - 'tools/ci_run_check.sh'
      - 'tools/export_mobile.py'
      - 'tools/export_presets.py'
      - 'tools/stamp_release_version.py'
      - 'tools/verify_build.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-input-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  controls:
    name: Touch input and safe-area regression (desktop engine)
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-godot
      - name: Validate mobile export contracts
        run: |
          python3 tools/export_mobile.py check
          python3 tests/mobile_export_test.py
      - name: Import the game and test phone and tablet geometry
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/mobile-controls
          export XDG_DATA_HOME="$RUNNER_TEMP/mobile-test-user-data"
          godot --version
          godot --headless --path . --import > build/mobile-controls/import.log 2>&1
          status=0
          godot --headless --path . --script res://tests/mobile_controls_test.gd -- --mobile-preview 2>&1 | tee build/mobile-controls/controls.log || status=1
          # The fresh import can try the project theme before importing its font. The
          # runtime must be clean of parse errors; do not waive any test failure.
          if grep -E 'SCRIPT ERROR|Parse Error' build/mobile-controls/controls.log; then status=1; fi
          if (( status != 0 )); then
            grep -E -A1 'SCRIPT ERROR|Parse Error|FAIL|watchdog' build/mobile-controls/controls.log | head -32 > "$RUNNER_TEMP/mobile-failures" || true
            while IFS= read -r line; do printf '::error title=Mobile controls::%s\n' "$line"; done < "$RUNNER_TEMP/mobile-failures"
          fi
          exit "$status"
      - name: Render the joystick, return prompt and resulting title
        if: ${{ !cancelled() }}
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -euo pipefail
          export XDG_DATA_HOME="$RUNNER_TEMP/mobile-capture-user-data"
          export CI_LOG_DIR=build/mobile-controls
          source tools/ci_run_check.sh
          run_check mobile_capture 140 xvfb-run -a --server-args='-screen 0 2560x1440x24' \
            godot --path . --resolution 2532x1170 --rendering-method gl_compatibility \
            --script res://tests/capture_mobile_controls.gd -- --mobile-preview || {
              grep -E -A1 'SCRIPT ERROR|Parse Error' "$CI_LOG_DIR/mobile_capture.log" | head -20 \
                | while IFS= read -r line; do printf '::error title=Mobile capture::%s\n' "$line"; done || true
              exit 1
            }
          cd build/mobile-controls/frames
          {
            printf 'source_sha=%s\n' "$(git rev-parse HEAD)"
            grep '^MOBILE_CAPTURE ' ../mobile_capture.log
            sha256sum 01_gameplay_joystick_and_return.png 02_return_confirmation.png 03_main_menu_after_return.png
          } | tee CAPTURE.txt
          while IFS= read -r line; do printf '::notice title=Mobile screenshot evidence::%s\n' "$line"; done < CAPTURE.txt
      - name: Upload input and layout results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mobile-controls-${{ github.run_number }}
          path: build/mobile-controls/
          retention-days: 14

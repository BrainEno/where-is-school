name: Mobile input regression

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - '.github/workflows/mobile-ci.yml'
      - '.github/actions/setup-godot/**'
      - '.godot-version'
      - 'project.godot'
      - 'export_presets.cfg'
      - 'packaging/version.txt'
      - 'default_bus_layout.tres'
      - 'scripts/**'
      - 'scenes/**'
      - 'assets/**'
      - 'data/**'
      - 'tests/mobile*'
      - 'tests/capture_mobile_controls.gd'
      - 'tests/test_harness.gd'
      - 'tools/ci_run_check.sh'
      - 'tools/export_mobile.py'
      - 'tools/export_presets.py'
      - 'tools/stamp_release_version.py'
      - 'tools/verify_build.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-input-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  controls:
    name: Touch input and safe-area regression (desktop engine)
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-godot
      - name: Validate mobile export contracts
        run: |
          python3 tools/export_mobile.py check
          python3 tests/mobile_export_test.py
      - name: Import the game and test phone and tablet geometry
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/mobile-controls
          export XDG_DATA_HOME="$RUNNER_TEMP/mobile-test-user-data"
          godot --version
          godot --headless --path . --import > build/mobile-controls/import.log 2>&1
          export CI_LOG_DIR=build/mobile-controls
          source tools/ci_run_check.sh
          run_check controls 90 godot --headless --path . \
            --script res://tests/mobile_controls_test.gd -- --mobile-preview || true
          XDG_DATA_HOME="$RUNNER_TEMP/mobile-opening-user-data" \
            run_check mobile_opening 75 godot --headless --path . \
              --script res://tests/mobile_pack_boot.gd -- --mobile-preview || true
          if (( status == 0 )); then
            verdict="$(grep '^PASS: MOBILE_OPENING_TOUCH_OK ' "$CI_LOG_DIR/mobile_opening.log")"
            printf '::notice title=New game to mobile controls::%s\n' "$verdict"
          fi
          run_check_summary
      - name: Render the joystick, compact pause, return prompt and resulting title
        id: capture
        if: ${{ !cancelled() }}
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -euo pipefail
          export XDG_DATA_HOME="$RUNNER_TEMP/mobile-capture-user-data"
          export CI_LOG_DIR=build/mobile-controls
          source tools/ci_run_check.sh
          run_check mobile_capture 140 xvfb-run -a --server-args='-screen 0 2560x1440x24' \
            godot --path . --resolution 2532x1170 --rendering-method gl_compatibility \
            --script res://tests/capture_mobile_controls.gd -- --mobile-preview || true
          if (( status != 0 )); then run_check_summary; fi
          cd build/mobile-controls/frames
          {
            printf 'source_sha=%s\n' "$(git rev-parse HEAD)"
            grep '^MOBILE_CAPTURE ' ../mobile_capture.log
            sha256sum 01_gameplay_joystick_and_return.png 02_return_confirmation.png 03_main_menu_after_return.png 04_compact_pause_menu.png
          } | tee CAPTURE.txt
          while IFS= read -r line; do printf '::notice title=Mobile screenshot evidence::%s\n' "$line"; done < CAPTURE.txt
          # A small same-frame JPEG, not a replacement for the original PNG. GitHub
          # limits notices per step, so publish each frame in a step of its own.
          cat > "$RUNNER_TEMP/publish-mobile-preview.sh" <<'BASH'
          set -euo pipefail
          cd build/mobile-controls/frames
          frame="$1.preview.jpg"
          if [[ ! -s "$frame" ]]; then
            printf '::warning title=Mobile preview unavailable::%s\n' "$frame"
            exit 0
          fi
          data=$(base64 -w0 "$frame")
          parts=$(( (${#data} + 3999) / 4000 ))
          printf '::notice title=Mobile preview checksum::%s\n' "$(sha256sum "$frame")"
          for ((i=0; i<parts; i++)); do
            printf '::notice title=Mobile preview %s %d/%d::%s\n' "$frame" "$((i+1))" "$parts" "${data:$((i*4000)):4000}"
          done
          BASH
      - name: Relay gameplay review preview
        if: ${{ !cancelled() && steps.capture.outcome == 'success' }}
        run: bash "$RUNNER_TEMP/publish-mobile-preview.sh" 01_gameplay_joystick_and_return
      - name: Relay confirmation review preview
        if: ${{ !cancelled() && steps.capture.outcome == 'success' }}
        run: bash "$RUNNER_TEMP/publish-mobile-preview.sh" 02_return_confirmation
      - name: Relay main-menu review preview
        if: ${{ !cancelled() && steps.capture.outcome == 'success' }}
        run: bash "$RUNNER_TEMP/publish-mobile-preview.sh" 03_main_menu_after_return
      - name: Relay compact pause review preview
        if: ${{ !cancelled() && steps.capture.outcome == 'success' }}
        run: bash "$RUNNER_TEMP/publish-mobile-preview.sh" 04_compact_pause_menu
      - name: Upload input and layout results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mobile-controls-${{ github.run_number }}
          path: build/mobile-controls/
          retention-days: 14

name: Temporary yard bake
on:
  push:
    branches: [arena/5a064093-where-is-school]
permissions:
  contents: read
jobs:
  bake:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: ./.github/actions/setup-godot
      - name: Bake generated yard
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/build_outdoor_locations.py playground
          python3 scenes/environment/props/playground_art/source/build_playground_art.py
          tar -czf "$RUNNER_TEMP/yard.tar.gz" scenes/locations/playground/playground.tscn scenes/environment/props/playground_art/scenery.scn scenes/environment/props/playground_art/meshes/*.mesh
          base64 -w0 "$RUNNER_TEMP/yard.tar.gz" | fold -w4000 | awk '{printf "%03d %s\n", NR, $0}' > "$RUNNER_TEMP/yard-parts"
          test "$(wc -l < "$RUNNER_TEMP/yard-parts")" -le 50
          sha256sum "$RUNNER_TEMP/yard.tar.gz"
      - name: Publish 1
        run: sed -n '1,10p' "$RUNNER_TEMP/yard-parts" | while read -r n data; do echo "::notice title=yard-bake-${n}::${data}"; done
      - name: Publish 2
        run: sed -n '11,20p' "$RUNNER_TEMP/yard-parts" | while read -r n data; do echo "::notice title=yard-bake-${n}::${data}"; done
      - name: Publish 3
        run: sed -n '21,30p' "$RUNNER_TEMP/yard-parts" | while read -r n data; do echo "::notice title=yard-bake-${n}::${data}"; done
      - name: Publish 4
        run: sed -n '31,40p' "$RUNNER_TEMP/yard-parts" | while read -r n data; do echo "::notice title=yard-bake-${n}::${data}"; done
      - name: Publish 5
        run: sed -n '41,50p' "$RUNNER_TEMP/yard-parts" | while read -r n data; do echo "::notice title=yard-bake-${n}::${data}"; done

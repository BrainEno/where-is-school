name: Test tooling

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  commit-messages:
    # Issue #222: docs/AGENT_PROTOCOL.md §3 asks for English conventional commit subjects,
    # and nothing checked it, so it was quietly broken. This checks the commits a pull
    # request adds (merge commits exempt; see the tool). Only on pull requests: `main`'s
    # history is what it is.
    name: Commit subjects follow the protocol
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Check the pull request's commit subjects
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          python3 tools/check_commit_messages.py --range "${BASE_SHA}..${HEAD_SHA}"

  tooling:
    name: Test registration and Python tool reproducibility
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Create an isolated Python tooling environment
        shell: bash
        run: |
          set -euo pipefail
          # Ubuntu 24.04 supplies CPython 3.12 and its matching development headers.
          # meshoptimizer is a source build, not an undeclared preinstalled wheel.
          python3 --version
          command -v c++
          python3 - <<'PY'
          import sysconfig
          from pathlib import Path
          header = Path(sysconfig.get_path("include")) / "Python.h"
          if not header.is_file():
              raise SystemExit("Missing Python.h: install matching python3-dev headers")
          PY
          python3 -m venv .venv
          .venv/bin/python -m pip install -r tools/requirements.txt
          .venv/bin/python -m pip check

      - name: Check standalone test registration and dependency contracts
        shell: bash
        run: |
          set -euo pipefail
          .venv/bin/python tools/check_test_registration.py --check
          .venv/bin/python tests/test_registration_test.py
          .venv/bin/python tests/tool_requirements_test.py
          .venv/bin/python tests/character_geometry_test.py
          .venv/bin/python tests/character_geometry_capture_test.py
          .venv/bin/python tests/mobile_tools_test.py

      - name: Verify Blender head geometry against the pinned basis
        shell: bash
        run: |
          set -euo pipefail
          bases="$(PYTHONPATH=tools .venv/bin/python -c 'import character_sculpt as s; print(s.BASE, s.REVIEW_BASE, s.Q_CLOSEUP_BASE, s.BQ_POLISH_BASE, s.CLASSROOM_POLISH_BASE)')"
          for sculpt_base in $bases; do
            if ! git cat-file -e "${sculpt_base}^{commit}" 2>/dev/null; then
              git fetch --no-tags --no-recurse-submodules --depth=1 origin "$sculpt_base"
            fi
          done
          .venv/bin/python tests/character_sculpt_test.py

      - name: Exercise the declared GDScript parser
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(find scripts scenes tests addons -name '*.gd' | sort)
          .venv/bin/gdparse "${files[@]}"

      - name: Gate new GDScript quality debt
        shell: bash
        env:
          QUALITY_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            .venv/bin/python tools/check_gdscript_quality.py --inventory
            exit 0
          fi
          if [[ ! "$QUALITY_BASE" =~ ^[0-9a-f]{40}$ || "$QUALITY_BASE" =~ ^0+$ ]]; then
            echo 'A PR or push must supply an actual GDScript quality comparison base.' >&2
            exit 2
          fi
          # The checkout is shallow. Fetch at most the missing base commit, not the
          # full history with earlier versions of the models and screenshots.
          if ! git cat-file -e "${QUALITY_BASE}^{commit}" 2>/dev/null; then
            git fetch --no-tags --no-recurse-submodules --depth=1 origin "$QUALITY_BASE"
          fi
          .venv/bin/python tools/check_gdscript_quality.py --base "$QUALITY_BASE"

      - name: Exercise the GDScript quality gate and its CI wiring
        shell: bash
        run: |
          set -euo pipefail
          .venv/bin/python tests/gdscript_quality_test.py
          .venv/bin/python tests/gdscript_quality_ci_test.py

      - name: Test the Godot import preflight without the engine
        shell: bash
        run: bash tests/ci_import_godot_test.sh

      - name: Check Python tools and asset sources without rewriting them
        shell: bash
        run: |
          set -euo pipefail
          # Every tools/*.py that exposes a standalone --check mode. Evidence readers
          # and export verifiers need real capture/build inputs and are not fabricated here.
          for tool in \
            build_app_icon build_container_yard build_laboratory build_music_loop build_port build_roof_collector build_sample_models \
            build_site_interior build_student_chair build_teaching_block check_agent_docs check_scene_order check_story_flags check_test_registration godot_sidecars \
            model_library prepare_classroom_student prepare_portraits prepare_q prepare_teacher_n repo_size \
            screenshot_evidence stamp_release_version subset_font
          do
            echo "=== tools/${tool}.py --check"
            if ! .venv/bin/python "tools/${tool}.py" --check; then
              # The job log is not always reachable; the annotation names the tool.
              echo "::error title=python tool check::tools/${tool}.py --check failed"
              exit 1
            fi
          done
          .venv/bin/python tools/check_workflow_action_pins.py
          # Issue #292: the story-flag registry against the content; #291: no .tscn node
          # declared before its parent. Both directions, on trees the tests write.
          .venv/bin/python tests/story_flags_test.py
          .venv/bin/python tests/scene_order_test.py
          # Issue #286: no hand-kept font subset size in the live docs.
          .venv/bin/python tests/font_size_prose_test.py
          # Issue #222: the commit-subject rule itself (the PR's own commits: job below).
          .venv/bin/python tests/commit_messages_test.py
          .venv/bin/python art/characters/build_character_looks.py --check
          .venv/bin/python art/classroom/paint_classroom_textures.py --check
          .venv/bin/python art/laboratory/paint_laboratory_textures.py --check
          git diff --exit-code

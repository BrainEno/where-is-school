name: Diagnose the exported iOS pack smoke test

on:
  push:
    branches: [arena/31215324-where-is-school]
    paths: ['.github/workflows/livecontainer-device-diagnostics.yml']

permissions:
  actions: read

jobs:
  smoke-log:
    name: Report the failed pack smoke verdict
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Read the finished device job and emit the test reason
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          job=137136307350
          endpoint="repos/$GITHUB_REPOSITORY/actions/jobs/$job"
          gh api "$endpoint" | jq -e 'select(.run_id == 44999051774 and .head_sha == "dfba9d639372fba66a8937c28be7c4b753105dfd" and .conclusion == "failure")' > /dev/null
          gh api "$endpoint/logs" > "$RUNNER_TEMP/wis-export-smoke.log"
          python3 - "$RUNNER_TEMP/wis-export-smoke.log" <<'PY'
          import pathlib, re, sys, zipfile
          log = pathlib.Path(sys.argv[1])
          if zipfile.is_zipfile(log):
              with zipfile.ZipFile(log) as archive:
                  data = '\n'.join(archive.read(name).decode('utf8','replace') for name in archive.namelist() if 'exported iOS' in name)
          else:
              data = log.read_text(errors='replace')
              data = data[data.rfind('##[group]Run set -euo pipefail', 0, data.find('wis-pack-probe')):]
          pattern = re.compile(r'FAIL: mobile opening touch:|SCRIPT ERROR|Parse Error|Godot Engine|ERROR: |MOBILE_OPENING_TOUCH_OK')
          rows = [line for line in data.splitlines() if pattern.search(line) and not line.startswith('##')]
          for line in rows[-16:]:
              print('::notice title=Exported pack verdict::' + line[:600].replace('%','%25'))
          if not rows:
              raise SystemExit('No matching pack smoke verdict in the job log')
          PY
